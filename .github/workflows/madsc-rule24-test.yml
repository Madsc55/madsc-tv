name: MADSC - 24. Kural Güvenlik Testi
on:
  push:
    paths:
      - 'tools/workflow_failure_gate.py'
      - 'test_workflow_failure_gate.py'
      - '.github/workflows/madsc-rule24-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Ardışık hata güvenlik denetimi
    runs-on: ubuntu-latest
    steps:
      - name: Depo dosyalarını al
        uses: actions/checkout@v4
      - name: Python ortamını hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Başarısızlık zinciri kurallarını test et
        run: python3 -m unittest test_workflow_failure_gate -v
