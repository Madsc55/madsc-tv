name: Aday Bekletme ve Tekrar Kontrol
on:
  workflow_dispatch:
  schedule:
    - cron: '25 5 * * *'
permissions:
  contents: write
jobs:
  quarantine:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install media probe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Scan candidates without modifying playlists
        run: python3 yeni_kanal_tara.py
      - name: Update quarantine from fresh scan
        run: python3 aday_bekletme.py
      - name: Upload quarantine and scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aday-bekletme-raporu
          if-no-files-found: warn
          path: |
            YENILER_TARAMA_RAPORU.csv
            YENILER_KAYNAK_HATALARI.txt
            aday_bekletme/ADAY_DURUM_RAPORU.csv
            aday_bekletme/gecmis.json
      - name: Commit quarantine reports only
        if: success()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add aday_bekletme/ADAY_DURUM_RAPORU.csv aday_bekletme/gecmis.json
          git diff --cached --quiet || (git commit -m "Update candidate quarantine report" && git push)
