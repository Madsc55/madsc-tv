name: Aday Bekletme ve Tekrar Kontrol
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/aday-bekletme.yml'
  schedule:
    - cron: '25 5 * * *'
permissions:
  contents: write
concurrency:
  group: aday-bekletme-main
  cancel-in-progress: false
jobs:
  quarantine:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install media probe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Scan candidates without modifying playlists
        run: python3 yeni_kanal_tara.py
      - name: Decode promising streams for up to 20 seconds
        run: python3 gelismis_medya_testi.py
      - name: Update quarantine from fresh scan
        run: python3 aday_bekletme.py
      - name: Score source reliability without modifying playlists
        run: python3 kaynak_guven_puani.py
      - name: Upload quarantine and scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aday-bekletme-raporu
          if-no-files-found: warn
          path: |
            YENILER_TARAMA_RAPORU.csv
            YENILER_KAYNAK_HATALARI.txt
            aday_bekletme/ADAY_DURUM_RAPORU.csv
            aday_bekletme/gecmis.json
            aday_bekletme/KAYNAK_GUVEN_PUANLARI.csv
            aday_bekletme/GELISMIS_MEDYA_TESTI.csv
      - name: Commit quarantine reports only
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          mkdir -p /tmp/aday-raporlar
          for f in aday_bekletme/ADAY_DURUM_RAPORU.csv aday_bekletme/gecmis.json aday_bekletme/KAYNAK_GUVEN_PUANLARI.csv aday_bekletme/GELISMIS_MEDYA_TESTI.csv; do
            if [ -f "$f" ]; then
              cp "$f" "/tmp/aday-raporlar/$(basename "$f")"
            fi
          done
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for f in /tmp/aday-raporlar/*; do
              [ -f "$f" ] || continue
              cp "$f" "aday_bekletme/$(basename "$f")"
            done
            git add aday_bekletme/ADAY_DURUM_RAPORU.csv aday_bekletme/gecmis.json aday_bekletme/KAYNAK_GUVEN_PUANLARI.csv aday_bekletme/GELISMIS_MEDYA_TESTI.csv
            if git diff --cached --quiet; then
              echo "Raporlarda yeni degisiklik yok."
              exit 0
            fi
            git commit -m "Update candidate quarantine report"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Kayit cakismasi: son depo durumu ile tekrar deneniyor ($attempt/5)"
            sleep $((attempt * 3))
          done
          echo "Rapor GitHub'a kaydedilemedi; Actions artefakti saklandi."
          exit 1
