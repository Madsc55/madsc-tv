name: Aday Bekletme ve Tekrar Kontrol
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/aday-bekletme.yml'
      - 'aday_tekrar_raporu.py'
      - 'kaynak_guven_puani.py'
      - 'aday_oncelik_raporu.py'
      - 'akilli_tekrar_test_takvimi.py'
      - 'altinci_aday_tekrar_test.py'
  schedule:
    - cron: '25 5 * * *'
permissions:
  contents: write
concurrency:
  group: aday-bekletme-main
  cancel-in-progress: false
jobs:
  quarantine:
    name: Aday tarama ve güvenilirlik kontrolü
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Medya test araçlarını kur
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Ana listeyi değiştirmeden aday kanalları tara
        run: python3 yeni_kanal_tara.py
      - name: Tekrarlanan kanal bağlantılarını raporla
        run: python3 aday_tekrar_raporu.py
      - name: Yayınların görüntü ve sesini test et
        run: python3 gelismis_medya_testi.py
      - name: Aday bekletme kayıtlarını güncelle
        run: python3 aday_bekletme.py
      - name: Akıllı tekrar test takvimini hazırla
        run: python3 akilli_tekrar_test_takvimi.py
      - name: Zamanı gelen adayları yeniden test et
        env:
          RETEST_LIMIT: '5'
        run: python3 altinci_aday_tekrar_test.py
      - name: Kaynak güvenilirlik puanlarını hesapla
        run: python3 kaynak_guven_puani.py
      - name: Aday kanalları öncelik sırasına koy
        run: python3 aday_oncelik_raporu.py
      - name: Tarama ve test raporlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aday-bekletme-raporu
          if-no-files-found: warn
          path: |
            YENILER_TARAMA_RAPORU.csv
            YENILER_KAYNAK_HATALARI.txt
            aday_bekletme/ADAY_DURUM_RAPORU.csv
            aday_bekletme/gecmis.json
            aday_bekletme/KAYNAK_GUVEN_PUANLARI.csv
            aday_bekletme/GELISMIS_MEDYA_TESTI.csv
            aday_bekletme/TEKRAR_EDEN_ADAYLAR.csv
            aday_bekletme/ADAY_ONCELIK_RAPORU.csv
            aday_bekletme/AKILLI_TEKRAR_TEST_TAKVIMI.csv
            aday_bekletme/ALTINCI_TEKRAR_TEST.csv
      - name: Test raporlarını GitHub'a kaydet
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          mkdir -p /tmp/aday-raporlar
          for f in aday_bekletme/ADAY_DURUM_RAPORU.csv aday_bekletme/gecmis.json aday_bekletme/KAYNAK_GUVEN_PUANLARI.csv aday_bekletme/GELISMIS_MEDYA_TESTI.csv aday_bekletme/TEKRAR_EDEN_ADAYLAR.csv aday_bekletme/ADAY_ONCELIK_RAPORU.csv; do
            if [ -f "$f" ]; then
              cp "$f" "/tmp/aday-raporlar/$(basename "$f")"
            fi
          done
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for f in /tmp/aday-raporlar/*; do
              [ -f "$f" ] || continue
              cp "$f" "aday_bekletme/$(basename "$f")"
            done
            git add aday_bekletme/ADAY_DURUM_RAPORU.csv aday_bekletme/gecmis.json aday_bekletme/KAYNAK_GUVEN_PUANLARI.csv aday_bekletme/GELISMIS_MEDYA_TESTI.csv aday_bekletme/TEKRAR_EDEN_ADAYLAR.csv aday_bekletme/ADAY_ONCELIK_RAPORU.csv
            if git diff --cached --quiet; then
              echo "Raporlarda yeni degisiklik yok."
              exit 0
            fi
            git commit -m "Aday bekletme raporlarını güncelle"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Kayit cakismasi: son depo durumu ile tekrar deneniyor ($attempt/5)"
            sleep $((attempt * 3))
          done
          echo "Rapor GitHub'a kaydedilemedi; Actions artefakti saklandi."
          exit 1
