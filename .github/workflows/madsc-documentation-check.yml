name: MADSC Documentation Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check project records
        run: |
          test -s AGENTS.md
          test -s OZELLIK_ENVANTERI.md
          test -s DEVAM_NOTU.md
          grep -q 'Kural 25' AGENTS.md
          grep -q 'build_epg.py' OZELLIK_ENVANTERI.md
          head -n 1 CALISANLAR.m3u | grep -q '#EXTM3U'
