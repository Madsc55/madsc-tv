name: "Yedek Geri Yukleme - Guvenli Tatbikat"
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/yedek-geri-yukleme-tatbikat.yml"
      - "scripts/restore_dry_run.py"
permissions:
  contents: read
jobs:
  restore-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore backups into isolated temporary directory and verify
        run: python3 scripts/restore_dry_run.py
      - name: Save verified restore report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MADSC-YEDEK-GERI-YUKLEME-DOGRULAMA
          path: RESTORE-DRY-RUN-REPORT.json
          if-no-files-found: error
