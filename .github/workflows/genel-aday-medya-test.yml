name: Genel Aday Gercek Medya Testi
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/genel_aday_medya_test.py'
      - '.github/workflows/genel-aday-medya-test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Discover candidates read-only
        run: python3 -u yeni_kanal_tara.py
        env:
          SCAN_BATCH: '-1'
      - name: Real video/audio probe for first candidate batch
        run: python3 -u scripts/genel_aday_medya_test.py
        env:
          ADAY_TEST_GRUBU: '0'
      - name: Upload report only
        uses: actions/upload-artifact@v4
        with:
          name: GENEL-ADAY-GERCEK-MEDYA
          if-no-files-found: error
          retention-days: 30
          path: |
            GENEL_ADAY_GERCEK_MEDYA_RAPORU.csv
            GENEL_ADAY_MEDYA_OZET.json
