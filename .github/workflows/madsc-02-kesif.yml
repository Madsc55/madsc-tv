name: MADSC 02 - Kanal Kesfi Toplu
on:
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  actions: read
concurrency:
  group: madsc-kesif-tek-kosu-${{ github.ref }}
  cancel-in-progress: false
jobs:
  kesif:
    name: MADSC 02 - Kanal Kesfi Toplu - tek kosuda butun denetimler
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Korunan dosyalarin baslangic ozeti
        run: |
          mkdir -p madsc_merkezi_denetim
          sha256sum CALISANLAR.m3u AGENTS.md GUVENLIK_KURALLARI.md > "${RUNNER_TEMP}/madsc-protected.sha256"
      - name: Onceki kesif gecmisini guvenle geri yukle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p madsc_kesif madsc_merkezi_denetim
          run_id="$(gh run list --workflow madsc-02-kesif.yml --branch "${GITHUB_REF_NAME}" --status success --limit 20 --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -z "${run_id}" ]]; then
            echo "::notice::Onceki basarili kesif kosusu yok; ilk calistirma icin bos ama gecerli gecmis baslatiliyor."
            python3 -c 'import json,pathlib; p=pathlib.Path("madsc_kesif"); (p/"gecmis.json").write_text(json.dumps({"history":{}})+"\\n",encoding="utf-8"); (p/"ana_liste_test_gecmisi.json").write_text(json.dumps({"channels":{}})+"\\n",encoding="utf-8")'
            exit 0
          fi
          mkdir -p "${RUNNER_TEMP}/madsc-onceki-kesif"
          gh run download "${run_id}" --name madsc-kesif-tek-kosu-rapor --dir "${RUNNER_TEMP}/madsc-onceki-kesif"
          for file in gecmis.json ana_liste_test_gecmisi.json; do
            source="${RUNNER_TEMP}/madsc-onceki-kesif/madsc_kesif/${file}"
            if [[ ! -f "${source}" && -f "${RUNNER_TEMP}/madsc-onceki-kesif/${file}" ]]; then
              source="${RUNNER_TEMP}/madsc-onceki-kesif/${file}"
            fi
            if [[ ! -f "${source}" ]]; then
              echo "::error::Onceki gecmis dosyasi eksik: ${file}"
              exit 1
            fi
            python3 -c 'import json,sys; data=json.load(open(sys.argv[1],encoding="utf-8")); assert isinstance(data.get(sys.argv[2]),dict), "invalid history"' "${source}" "$( [[ "${file}" == gecmis.json ]] && echo history || echo channels )"
            cp "${source}" "madsc_kesif/${file}"
          done
          echo "Onceki kesif gecmisi geri yuklendi: run ${run_id}"
      - name: Kategoriye ait tum rapor kontrolleri
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/central_source_reconciliation.py
          python3 scripts/central_duplicate_test_audit.py
          python3 scripts/central_ibo_review_queue.py
      - name: Gercek aday kesfi ve teknik aday taramasi
        continue-on-error: true
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          python3 madsc_akilli_kesif.py
      - name: Kategoriye ait tum regresyon testleri
        run: python3 -m unittest test_candidate_logo_missing_report test_central_source_reconciliation test_central_duplicate_test_audit test_central_ibo_review_queue -v
      - name: Korunan dosyalar degismedi
        if: always()
        run: sha256sum -c "${RUNNER_TEMP}/madsc-protected.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: madsc-kesif-tek-kosu-rapor
          path: |
            madsc_merkezi_denetim/
            madsc_kesif/
          if-no-files-found: warn
# Read-only shadow discovery: twice daily UTC (05:17,17:17) on default branch only.
# Existing legacy discovery workflows remain enabled; no playlist write or migration approval.
