name: MADSC 02 - Kanal Kesfi Toplu
on:
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  actions: read
concurrency:
  group: madsc-kesif-tek-kosu-${{ github.ref }}
  cancel-in-progress: false
jobs:
  kesif:
    name: MADSC 02 - Kanal Kesfi Toplu - tek kosuda butun denetimler
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PNG aday logosu bagimliliklari
        run: python3 -m pip install --disable-pip-version-check Pillow CairoSVG
      - name: Korunan dosyalarin baslangic ozeti
        run: |
          mkdir -p madsc_merkezi_denetim
          sha256sum CALISANLAR.m3u AGENTS.md GUVENLIK_KURALLARI.md > "${RUNNER_TEMP}/madsc-protected.sha256"
      - name: Onceki kesif gecmisini guvenle geri yukle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p madsc_kesif madsc_merkezi_denetim
          # Checked-out history is authoritative; never replace it with an older artifact.
          if [[ -e madsc_kesif/gecmis.json || -e madsc_kesif/ana_liste_test_gecmisi.json ]]; then
            for file in gecmis.json ana_liste_test_gecmisi.json; do
              key="channels"
              [[ "${file}" == "gecmis.json" ]] && key="history"
              if [[ ! -f "madsc_kesif/${file}" ]] || ! python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); assert isinstance(d,dict) and isinstance(d.get(sys.argv[2]),dict)' "madsc_kesif/${file}" "${key}"; then
                echo "::error::Depodaki gecmis eksik veya bozuk: ${file}; otomatik sifirlama/geri yukleme yapilmadi."
                exit 1
              fi
            done
            echo "Depodaki dogrulanmis iki gecmis dosyasi korunarak kullaniliyor."
            exit 0
          fi
          run_ids="$(gh run list --workflow madsc-02-kesif.yml --branch "${GITHUB_REF_NAME}" --status success --limit 100 --json databaseId --jq '.[].databaseId')"
          if [[ -z "${run_ids}" ]]; then
            if [[ -e madsc_kesif/gecmis.json || -e madsc_kesif/ana_liste_test_gecmisi.json ]]; then
              echo "::error::Onceki kosu bulunamadi ancak depoda gecmis dosyasi var; mevcut kayitlarin uzerine yazilmayacak."
              exit 1
            fi
            echo "::notice::Onceki basarili kesif kosusu yok; ilk calistirma icin bos gecmis olusturuluyor."
            python3 -c 'import json,pathlib; p=pathlib.Path("madsc_kesif"); (p/"gecmis.json").write_text(json.dumps({"history":{}})+chr(10),encoding="utf-8"); (p/"ana_liste_test_gecmisi.json").write_text(json.dumps({"channels":{}})+chr(10),encoding="utf-8")'
            exit 0
          fi
          restored=""
          for run_id in ${run_ids}; do
            source_dir="${RUNNER_TEMP}/madsc-onceki-kesif-${run_id}"
            mkdir -p "${source_dir}"
            if ! gh run download "${run_id}" --name madsc-kesif-tek-kosu-rapor --dir "${source_dir}"; then
              echo "::warning::Run ${run_id} artifact indirilemedi; daha eski basarili kosu deneniyor."
              continue
            fi
            files_ok=true
            for file in gecmis.json ana_liste_test_gecmisi.json; do
              source="${source_dir}/madsc_kesif/${file}"
              if [[ ! -f "${source}" && -f "${source_dir}/${file}" ]]; then
                source="${source_dir}/${file}"
              fi
              key="channels"
              [[ "${file}" == "gecmis.json" ]] && key="history"
              if [[ ! -f "${source}" ]] || ! python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); assert isinstance(d,dict) and isinstance(d.get(sys.argv[2]),dict)' "${source}" "${key}"; then
                files_ok=false
                break
              fi
            done
            if [[ "${files_ok}" == true ]]; then
              for file in gecmis.json ana_liste_test_gecmisi.json; do
                source="${source_dir}/madsc_kesif/${file}"
                [[ -f "${source}" ]] || source="${source_dir}/${file}"
                target="madsc_kesif/${file}"
                if [[ -e "${target}" && -s "${target}" ]]; then
                  if ! cmp -s "${source}" "${target}"; then
                    echo "::error::Depodaki mevcut gecmis ile artifact farkli: ${file}; kayitlarin uzerine yazilmadi."
                    exit 1
                  fi
                else
                  if [[ -e "${target}" ]]; then
                    echo "::error::Depoda bos gecmis dosyasi var: ${file}; otomatik ezilmeyecek."
                    exit 1
                  fi
                  cp "${source}" "${target}"
                fi
              done
              restored="${run_id}"
              break
            fi
            echo "::warning::Run ${run_id} gecmisi eksik veya gecersiz; daha eski basarili kosu deneniyor."
          done
          if [[ -z "${restored}" ]]; then
            echo "::error::Basarili kosularin hicbirinde gecerli iki gecmis dosyasi bulunamadi; gecmis sifirlanmayacak."
            exit 1
          fi
          echo "Gecerli kesif gecmisi geri yuklendi: run ${restored}"
      - name: Kategoriye ait tum rapor kontrolleri
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/central_source_reconciliation.py
          python3 scripts/central_duplicate_test_audit.py
          python3 scripts/central_ibo_review_queue.py
      - name: Gercek aday kesfi ve teknik aday taramasi
        id: discovery
        continue-on-error: true
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          python3 madsc_akilli_kesif.py
      - name: Kategoriye ait tum regresyon testleri
        run: python3 -m unittest test_candidate_logo_missing_report test_central_source_reconciliation test_central_duplicate_test_audit test_central_ibo_review_queue -v
      - name: Korunan dosyalar degismedi
        if: always()
        run: sha256sum -c "${RUNNER_TEMP}/madsc-protected.sha256"
      - name: Kesif basarisizlik kapisi
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.discovery.outcome }}" != "success" ]]; then
            echo "::error::Kesif teknik taramasi basarisiz; bu kosu basarili gecmis kaynagi sayilamaz."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: madsc-kesif-tek-kosu-rapor
          path: |
            madsc_merkezi_denetim/
            madsc_kesif/
          if-no-files-found: warn
# Read-only shadow discovery: twice daily UTC (05:17,17:17) on default branch only.
# Existing legacy discovery workflows remain enabled; no playlist write or migration approval.
