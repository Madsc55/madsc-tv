name: MADSC 02 - Kanal Kesfi Toplu
on:
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  actions: read
concurrency:
  group: madsc-kesif-tek-kosu-${{ github.ref }}
  cancel-in-progress: false
jobs:
  kesif:
    name: MADSC 02 - Kanal Kesfi Toplu - tek kosuda butun denetimler
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PNG aday logosu bagimliliklari
        run: python3 -m pip install --disable-pip-version-check Pillow CairoSVG
      - name: Korunan dosyalarin baslangic ozeti
        run: |
          mkdir -p madsc_merkezi_denetim
          sha256sum CALISANLAR.m3u AGENTS.md GUVENLIK_KURALLARI.md > "${RUNNER_TEMP}/madsc-protected.sha256"
          python3 scripts/k1_protected_integrity.py --mode snapshot --manifest "${RUNNER_TEMP}/madsc-protected.json"
      - name: Onceki kesif gecmisini guvenle geri yukle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/discovery_history_restore.py
      - name: Kategoriye ait tum rapor kontrolleri
        id: reports
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for script in scripts/central_source_reconciliation.py scripts/central_duplicate_test_audit.py scripts/central_ibo_review_queue.py; do
            echo "::group::${script}"
            if python3 "${script}"; then
              echo "PASS ${script}"
            else
              echo "::error::FAIL ${script}"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "${failed}"
      - name: Kesif medya test araclarini kur ve dogrula
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffprobe -version
          ffmpeg -version
      - name: Gercek aday kesfi ve teknik aday taramasi
        id: discovery
        continue-on-error: true
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/discovery_archive.py before
          python3 madsc_akilli_kesif.py
          python3 scripts/discovery_archive.py after
          python3 scripts/four_stage_discovery_report.py
      - name: Kategoriye ait tum regresyon testleri
        id: regressions
        continue-on-error: true
        run: python3 -m unittest test_candidate_logo_missing_report test_central_source_reconciliation test_central_duplicate_test_audit test_central_ibo_review_queue test_five_category_discovery_behavior test_five_category_discovery_history -v
      - name: Korunan dosyalar degismedi
        if: always()
        run: |
          set -euo pipefail
          sha256sum -c "${RUNNER_TEMP}/madsc-protected.sha256"
          python3 scripts/k1_protected_integrity.py --mode check --manifest "${RUNNER_TEMP}/madsc-protected.json"
      - name: Kesif basarisizlik kapisi
        if: always()
        shell: bash
        run: |
          failed=0
          for step in reports discovery regressions; do
            case "${step}" in
              reports) outcome="${{ steps.reports.outcome }}" ;;
              discovery) outcome="${{ steps.discovery.outcome }}" ;;
              regressions) outcome="${{ steps.regressions.outcome }}" ;;
            esac
            if [[ "${outcome}" != "success" ]]; then
              echo "::error::${step} basarisiz veya atlandi (${outcome}); bu kosu basarili gecmis kaynagi sayilamaz."
              failed=1
            fi
          done
          exit "${failed}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: madsc-kesif-tek-kosu-rapor
          path: |
            madsc_merkezi_denetim/
            madsc_kesif/
          if-no-files-found: warn
# Read-only shadow discovery: twice daily UTC (05:17,17:17) on default branch only.
# Existing legacy discovery workflows remain enabled; no playlist write or migration approval.
