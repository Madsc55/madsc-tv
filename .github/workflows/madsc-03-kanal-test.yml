name: MADSC 03 - Kanal Testleri Toplu
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: madsc-kanal-test-tek-kosu
  cancel-in-progress: false
jobs:
  kanal-test:
    name: MADSC 03 - Kanal Testleri Toplu - tek kosuda butun denetimler
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Korunan dosyalarin baslangic ozeti
        run: |
          mkdir -p madsc_merkezi_denetim
          sha256sum CALISANLAR.m3u AGENTS.md GUVENLIK_KURALLARI.md > "${RUNNER_TEMP}/madsc-protected.sha256"
      - name: Kategoriye ait tum rapor kontrolleri
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/central_identity_epg_logo_audit.py
          python3 scripts/central_main_playlist_run_evidence.py
      - name: Kategoriye ait tum regresyon testleri
        run: python3 -m unittest test_ana_liste_saglik test_central_identity_epg_logo_audit test_epg_tv_readiness test_central_main_playlist_run_evidence -v
      - name: Korunan dosyalar degismedi
        if: always()
        run: sha256sum -c "${RUNNER_TEMP}/madsc-protected.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: madsc-kanal-test-tek-kosu-rapor
          path: madsc_merkezi_denetim/
          if-no-files-found: warn
# Tek workflow_dispatch tum kategori denetimlerini calistirir; mevcut canli eski is akislari korunur.
