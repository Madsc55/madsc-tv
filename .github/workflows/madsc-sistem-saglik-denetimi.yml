name: MADSC - Genel Sistem Sağlık ve Güvenlik Denetimi
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  push:
    paths:
      - 'tools/sistem_saglik_denetimi.py'
      - '.github/workflows/**'
      - 'final_validation.py'
      - 'tools/son_kontrol_yedekler_aktar.py'
      - 'test_sistem_saglik_denetimi.py'
      - '.github/workflows/madsc-sistem-saglik-denetimi.yml'
permissions:
  contents: read
jobs:
  sistem-denetimi:
    name: Dosya otomasyon güvenlik ve bütünlük testi
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Depoyu salt okunur indir
        uses: actions/checkout@v4
      - name: Tüm GitHub Actions YAML dosyalarının sözdizimini doğrula
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 | xargs -0 -r -n1 ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0))'
      - name: Denetim kodunun testlerini çalıştır
        run: python3 -m unittest test_sistem_saglik_denetimi -v
      - name: Depodaki dosyaları ve otomasyonları denetle
        id: audit
        continue-on-error: true
        run: python3 tools/sistem_saglik_denetimi.py
      - name: Gerçek Actions çalışma durumlarını salt okunur denetle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p madsc_bakim
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq '{checked_runs: (.workflow_runs | length), failed: [.workflow_runs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | {id, name, conclusion, html_url}], cancelled: [.workflow_runs[] | select(.conclusion == "cancelled") | {id, name, html_url}], active: [.workflow_runs[] | select(.status == "in_progress" or .status == "queued") | {id, name, status, html_url}]}' > madsc_bakim/actions_durum_raporu.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path("madsc_bakim/actions_durum_raporu.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("## MADSC - Son 100 Actions çalışması\n")
              for key in ("failed", "cancelled", "active"):
                  out.write(f"- {key}: {len(report[key])}\n")
          PY
      - name: Sağlık bulgularını GitHub özetinde göster
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("madsc_bakim/sistem_saglik_raporu.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n## MADSC - Sistem sağlık bulguları\n")
              if not p.exists():
                  out.write("Denetim raporu oluşmadı.\n")
              else:
                  report = json.loads(p.read_text(encoding="utf-8"))
                  out.write(f"**Hata:** {report['counts']['ERROR']} | **Uyarı:** {report['counts']['WARN']} | **Bilgi:** {report['counts']['INFO']}\n\n")
                  for item in report["findings"][:60]:
                      out.write(f"- **{item['severity']}** {item['code']}: {item['detail']} — **Öneri:** {item.get('next_action', 'İncele')}\n")
          PY
      - name: Denetim raporunu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madsc-sistem-saglik-raporu
          path: |
            madsc_bakim/sistem_saglik_raporu.json
            madsc_bakim/actions_durum_raporu.json
          if-no-files-found: warn
      - name: Kritik sorun varsa testi başarısız say
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error::Sistem sağlık denetimi kritik hata buldu. Raporu indirip inceleyin."
          exit 1
