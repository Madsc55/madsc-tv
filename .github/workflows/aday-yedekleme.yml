name: Teknik test adaylarini yedekle
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/commands/aday-yedekleme.txt'
permissions:
  contents: write
jobs:
  yedek:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Basarili teknik test raporlarini yedek listesine aktar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 yedekler/teknik_adaylari_aktar.py
      - name: Yalnizca yeni yedek listesini kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yedekler/TUM_TEKNIK_TEST_ADAYLARI_2026-10-09.m3u
          if ! git diff --cached --quiet; then
            git commit -m "Backup technically passing channel candidates (not verified in player)"
            git push
          fi
