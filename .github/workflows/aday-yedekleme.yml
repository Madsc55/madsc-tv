name: Teknik test adaylarini yedekle
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/commands/aday-yedekleme.txt'
permissions:
  contents: read
jobs:
  yedek:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Basarili teknik test raporlarini yedek listesine aktar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 yedekler/teknik_adaylari_aktar.py
      - name: Aday yedek taslagini yalnizca rapor olarak sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ONAY-BEKLEYEN-TEKNIK-ADAYLAR
          path: yedekler/TUM_TEKNIK_TEST_ADAYLARI_2026-10-09.m3u
          if-no-files-found: warn
