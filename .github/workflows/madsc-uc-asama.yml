name: MADSC - Üç Aşamalı Aday Doğrulama
on:
  workflow_dispatch:
  push:
    paths:
      - 'verification_pipeline.py'
permissions:
  contents: write
  actions: read
concurrency:
  group: madsc-rapor-yazma
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Depo dosyalarını al
        uses: actions/checkout@v4
      - name: 24. kural - ardışık hata güvenlik kontrolü
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/workflow_failure_gate.py
      - name: En son kayıtlı durumu yükle
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Rapor başlangıç sürümünü kaydet
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse origin/main > "${RUNNER_TEMP}/madsc-rapor-base-sha"
      - name: Doğrulama kurallarını test et
        run: python3 -m unittest test_verification_pipeline -v
      - name: Yayın çözümleyicisini kurmadan önce eksik adayları kontrol et
        id: pending
        run: |
          python3 - <<'PYCODE'
          import datetime, json, os, pathlib
          from verification_pipeline import eligible
          state = json.loads(pathlib.Path('madsc_dogrulama/state.json').read_text())['channels']
          now = datetime.datetime.now(datetime.timezone.utc)
          due = sum(eligible(record, now) for record in state.values())
          history = json.loads(pathlib.Path('madsc_kesif/gecmis.json').read_text())['history']
          due += sum(key not in state and record.get('successful_runs', 0) > 0 for key, record in history.items())
          from madsc_akilli_kesif import key
          review_path = pathlib.Path('madsc_genis_tarama/candidate_review.json')
          if review_path.exists():
              review = json.loads(review_path.read_text())['candidates']
              due += sum(key(record['url']) not in state and key(record['url']) not in history for record in review.values() if record.get('status') == 'IDENTITY_REVIEW_REQUIRED_NOT_TESTED')
          print(f'Zamani gelen eksik deneme: {due}; bitmis kayitlar atlandi.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'due={due}\n')
          PYCODE
      - name: Yayın çözümleyicisini kur
        if: steps.pending.outputs.due != '0'
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Sırası gelen adayların yayınlarını doğrula
        if: steps.pending.outputs.due != '0'
        run: python3 verification_pipeline.py
      - name: Test çıktılarını arşivle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: madsc-uc-asama
          path: madsc_dogrulama/
          retention-days: 30
      - name: Yalnızca doğrulama durumunu kaydet
        if: steps.pending.outputs.due != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -a madsc_dogrulama "${RUNNER_TEMP}/verification"
          for attempt in $(seq 1 10); do
            git fetch origin main
            # Farkli bir calisma ayni rapor klasorunu degistirdiyse eski kopyayla ustune yazma.
            if ! git diff --quiet "$(cat "${RUNNER_TEMP}/madsc-rapor-base-sha")" origin/main -- madsc_dogrulama/; then
              echo "::error::Rapor klasoru bu calisma sirasinda degisti; eski sonuclarin uzerine yazilmadi. Artifact saklandi."
              exit 1
            fi
            git reset --hard origin/main
            mkdir -p madsc_dogrulama
            cp -a "${RUNNER_TEMP}/verification/." madsc_dogrulama/
            git add -- madsc_dogrulama/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Save separate three-stage candidate verification"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
