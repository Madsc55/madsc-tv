name: EPG Günlük Güncelleme
on:
  workflow_dispatch:
  schedule:
    - cron: '25 3 * * *'
permissions:
  contents: write
jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build independent EPG and coverage report
        run: |
          python3 scripts/build_epg.py
          python3 scripts/build_ibo_epg_test.py
      - name: Verify five-channel XMLTV and record pending TV test
        run: python3 scripts/epg_tv_readiness.py
      - name: Commit EPG output only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg/madsc-epg.xml epg/ibo-test-epg.xml epg/report.json epg/tv_kontrol_bekliyor.json
          git diff --cached --quiet || (git commit -m "Update EPG guide and coverage report" && git pull --rebase origin main && python3 tools/protected_write_gate.py --base origin/main && git push)
