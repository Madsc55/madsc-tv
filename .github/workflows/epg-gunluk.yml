name: EPG Günlük Güncelleme
on:
  push:
    paths:
      - 'scripts/build_epg.py'
      - '.github/workflows/epg-gunluk.yml'
  workflow_dispatch:
  schedule:
    - cron: '25 3 * * *'
permissions:
  contents: write
jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build independent EPG and coverage report
        run: python3 scripts/build_epg.py
      - name: Commit EPG output only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg/madsc-epg.xml epg/report.json
          git diff --cached --quiet || (git commit -m "Update EPG guide and coverage report" && git push)
