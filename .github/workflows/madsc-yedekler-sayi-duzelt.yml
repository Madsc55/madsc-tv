name: MADSC - Yedekler Sayisi Salt Okunur Kontrol
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: madsc-yedekler-sayi-kontrol
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Korunan kanal listesi butunlugunu denetle
        run: |
          set -euo pipefail
          test -f CALISANLAR.m3u
          git diff --exit-code -- CALISANLAR.m3u
