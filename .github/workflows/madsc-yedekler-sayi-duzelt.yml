name: MADSC - Yedekler Kanal Sayisini Duzelt
on:
  push:
    paths:
      - '.github/workflows/madsc-yedekler-sayi-duzelt.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git fetch origin main
          git reset --hard origin/main
      - run: python3 scripts/sync_yedekler_category_count.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CALISANLAR.m3u
          git diff --cached --quiet && exit 0
          git commit -m "Sync YEDEKLER category label with actual channel count"
          git push origin HEAD:main
