name: MADSC - Historical read-only audit - madsc-ibo-ilk-239.yml
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: madsc-historical-audit-madsc-ibo-ilk-239
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify historical playlist remains unchanged
        run: |
          set -euo pipefail
          before="$(sha256sum CALISANLAR.m3u | cut -d' ' -f1)"
          git diff --exit-code -- CALISANLAR.m3u
          after="$(sha256sum CALISANLAR.m3u | cut -d' ' -f1)"
          test "$before" = "$after"
          echo "Historical writer disabled; no user decisions replayed"
