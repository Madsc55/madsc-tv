name: Yeni Kanal Araması
on:
  workflow_dispatch:
  push:
    paths:
      - 'yeni_kanal_tara.py'
      - '.github/workflows/yeni-kanal-arama-2026.yml'
permissions:
  contents: read
jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Discover channels and test batch
        env:
          SCAN_BATCH: '1'
        run: python3 -u yeni_kanal_tara.py
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yeni-kanal-tarama-grup1
          if-no-files-found: warn
          path: |
            YENILER_TARAMA_RAPORU.csv
            YENILER_KAYNAK_HATALARI.txt

# Manual candidate refresh 2026-10-10; report-only, no protected playlist writes.
