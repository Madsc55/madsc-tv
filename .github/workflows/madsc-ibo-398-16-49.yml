name: MADSC - Historical 16-49 Archive Read-only Review
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: madsc-ibo-16-49-review
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify historical sources without replay
        run: |
          set -euo pipefail
          test -f scripts/archive_backups_16_49.py
          test -f CALISANLAR.m3u
          git diff --exit-code -- CALISANLAR.m3u
