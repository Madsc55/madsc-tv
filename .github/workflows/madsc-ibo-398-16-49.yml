name: MADSC - YEDEKLER 16-49 Yabanci Arsiv
on:
  push:
    paths:
      - '.github/workflows/madsc-ibo-398-16-49.yml'
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git fetch origin main
          git reset --hard origin/main
      - run: python3 scripts/archive_backups_16_49.py
      - run: |
          set -euo pipefail
          git diff --exit-code -- YABANCI_KANALLAR.m3u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CALISANLAR.m3u madsc_kesif/ibo_398_16_49_yabanci_arsiv.m3u madsc_kesif/ibo_398_16_49_rapor.json
          python3 tools/protected_write_gate.py --base origin/main
          git commit -m "Archive user-identified foreign backups 16-49"
          git push origin HEAD:main
