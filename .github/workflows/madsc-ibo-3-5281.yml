                   "status": "completed", "conclusion": conclusion}
                  for index, conclusion in enumerate(conclusions)
              ]

          cases = [
              ("one failure", history("success", "failure"), False, 1),
              ("two failures", history("success", "failure", "failure"), True, 2),
              ("timeout plus failure", history("success", "timed_out", "failure"), True, 2),
              ("success resets", history("failure", "failure", "success"), False, 0),
              ("cancel interrupts", history("failure", "cancelled", "failure"), False, 1),
              ("ignore current", history("success", "failure", "failure"), False, 1),
          ]
          for label, runs, blocked, count in cases:
