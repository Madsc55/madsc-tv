name: MADSC - IBO 3-5281 Guvenli Izole Prova
on:
  workflow_dispatch:
  push:
    branches:
      - madsc/p0-guvenli-yazma-kapisi-deneme-20261015
    paths:
      - '.github/workflows/madsc-ibo-3-5281.yml'
permissions:
  contents: read
concurrency:
  group: madsc-p0-ibo-3-5281-rehearsal
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: P0 isolated proof - verify workflow scope
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "madsc/p0-guvenli-yazma-kapisi-deneme-20261015"
          echo "Read-only rehearsal. No protected data is modified."
      - name: Check writer script syntax without executing it
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path("scripts/apply_ibo_3_5281.py").read_text(encoding="utf-8"))
          print("IBO writer script syntax OK; script not executed")
          PY
      - name: Simulate IBO transformation on disposable copy
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          source = root / "CALISANLAR.m3u"
          before = hashlib.sha256(source.read_bytes()).hexdigest()
          with tempfile.TemporaryDirectory() as temp:
              sandbox = Path(temp)
              (sandbox / "scripts").mkdir()
              (sandbox / "madsc_kesif").mkdir()
              # Historical 11367-entry layout is required by this one-time writer.
              # Build a synthetic fixture; never invent or rewrite real channel data.
              fixture = ["#EXTM3U\n"]
              for position in range(1, 11368):
                  fixture.append(
                      f'#EXTINF:-1 group-title="📦 YEDEKLER (11367)",Synthetic backup {position}\n'
                  )
                  fixture.append(f'https://example.invalid/backup/{position}\n')
              (sandbox / "CALISANLAR.m3u").write_text(
                  "".join(fixture), encoding="utf-8"
              )
              shutil.copy2(root / "scripts/apply_ibo_3_5281.py", sandbox / "scripts/apply_ibo_3_5281.py")
              result = subprocess.run(
                  [sys.executable, "scripts/apply_ibo_3_5281.py"],
                  cwd=sandbox, capture_output=True, text=True,
              )
              if result.returncode != 0:
                  print(result.stdout)
                  print(result.stderr)
                  raise SystemExit("Disposable-copy IBO simulation failed")
              for name in ("ibo_3_5281_ayrilanlar.m3u", "ibo_3_5281_kararlar.csv", "ibo_3_5281_rapor.json"):
                  if not (sandbox / "madsc_kesif" / name).is_file():
                      raise SystemExit("Missing simulation artifact: " + name)
              print("IBO transformation succeeded on synthetic 11367-entry disposable fixture only")
          after = hashlib.sha256(source.read_bytes()).hexdigest()
          if before != after:
              raise SystemExit("Protected source playlist changed")
          print("Protected repository playlist SHA256 unchanged")
          PY
      - name: Verify target files and guardrails
        run: |
          set -euo pipefail
          test -f CALISANLAR.m3u
          test -f YABANCI_KANALLAR.m3u
          test -f scripts/apply_ibo_3_5281.py
          test -f tools/workflow_failure_gate.py
          git diff --exit-code
          echo "Protected playlists unchanged; main write not attempted."
