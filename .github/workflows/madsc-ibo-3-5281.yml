name: MADSC - Guvenli Kanal Ayirma ve Yedek Dogrulama Testi
on:
  workflow_dispatch:
  push:
    branches:
      - madsc/p0-guvenli-yazma-kapisi-deneme-20261015
    paths:
      - '.github/workflows/madsc-ibo-3-5281.yml'
permissions:
  contents: read
concurrency:
  group: madsc-p0-ibo-3-5281-rehearsal
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 1 - Deneme dalini ve yazma iznini denetle
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "madsc/p0-guvenli-yazma-kapisi-deneme-20261015"
          echo "Read-only rehearsal. No protected data is modified."
      - name: 2 - Kanal ayirma betiginin kodunu dogrula
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path("scripts/apply_ibo_3_5281.py").read_text(encoding="utf-8"))
          print("IBO writer script syntax OK; script not executed")
          PY
      - name: 3 - 11367 sahte yedekle kanal ayirmayi sinama
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          source = root / "CALISANLAR.m3u"
          before = hashlib.sha256(source.read_bytes()).hexdigest()
          with tempfile.TemporaryDirectory() as temp:
              sandbox = Path(temp)
              (sandbox / "scripts").mkdir()
              (sandbox / "madsc_kesif").mkdir()
              # Historical 11367-entry layout is required by this one-time writer.
              # Build a synthetic fixture; never invent or rewrite real channel data.
              fixture = ["#EXTM3U\n"]
              for position in range(1, 11368):
                  fixture.append(
                      f'#EXTINF:-1 group-title="📦 YEDEKLER (11367)",Synthetic backup {position}\n'
                  )
                  fixture.append(f'https://example.invalid/backup/{position}\n')
              (sandbox / "CALISANLAR.m3u").write_text(
                  "".join(fixture), encoding="utf-8"
              )
              shutil.copy2(root / "scripts/apply_ibo_3_5281.py", sandbox / "scripts/apply_ibo_3_5281.py")
              result = subprocess.run(
                  [sys.executable, "scripts/apply_ibo_3_5281.py"],
                  cwd=sandbox, capture_output=True, text=True,
              )
              if result.returncode != 0:
                  print(result.stdout)
                  print(result.stderr)
                  raise SystemExit("Disposable-copy IBO simulation failed")
              for name in ("ibo_3_5281_ayrilanlar.m3u", "ibo_3_5281_kararlar.csv", "ibo_3_5281_rapor.json"):
                  if not (sandbox / "madsc_kesif" / name).is_file():
                      raise SystemExit("Missing simulation artifact: " + name)
              print("IBO transformation succeeded on synthetic 11367-entry disposable fixture only")
          after = hashlib.sha256(source.read_bytes()).hexdigest()
          if before != after:
              raise SystemExit("Protected source playlist changed")
          print("Protected repository playlist SHA256 unchanged")
          PY
      - name: 4 - Tarihsel ve guncel kanal listesi surumlerini dogrula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          refs = {
              "11367-yedek-geri-yukleme": "b5ce4a752104",
              "ilk-ibo-karar-uygulamasi": "2c5bbe376a20",
              "ibo-arsivleme": "a40e0df02d7a",
              "guncel-iki-yedek": "d647b05a0137",
          }
          expected = {
              "11367-yedek-geri-yukleme": "5fc6213b81cef58670d38aa5f863d01afde981c9",
              "ilk-ibo-karar-uygulamasi": "18a15d34e1e4e14f7b5d9fd6340e9f4e6e01363a",
              "ibo-arsivleme": "37479c66150636e3d1ab0ca92bf28129513f6f65",
              "guncel-iki-yedek": "b40aaf6615b120eac7bd936ccf022dc4a14025ae",
          }
          for label, ref in refs.items():
              url = f"https://api.github.com/repos/{repo}/contents/CALISANLAR.m3u?ref={ref}"
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
              })
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)
              if data["sha"] != expected[label]:
                  raise SystemExit("Historical blob SHA mismatch: " + label)
              print(label + ": original Git blob verified")
          source = Path("CALISANLAR.m3u")
          print("Current playlist SHA256: " + hashlib.sha256(source.read_bytes()).hexdigest())
          PY
      - name: 5 - Arsiv kayitlarini karar dosyasiyla tek tek karsilastir
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path("madsc_kesif")
          report = json.loads((root / "ibo_3_5281_rapor.json").read_text(encoding="utf-8"))
          decisions = list(csv.DictReader((root / "ibo_3_5281_kararlar.csv").open(encoding="utf-8", newline="")))
          archive = (root / "ibo_3_5281_ayrilanlar.m3u").read_text(encoding="utf-8-sig").splitlines()
          assert archive[0] == "#EXTM3U"
          archived = [(archive[i], archive[i+1]) for i in range(1, len(archive), 2)]
          expected = [row for row in decisions if row["action"] == "ARSIVE_ALINDI"]
          kept = [row for row in decisions if row["action"] == "YEDEKLERDE_KALDI"]
          assert len(decisions) == 5279, "Decision count mismatch"
          assert len(expected) == report["foreign_archived"] == 5252
          assert len(kept) == report["turkish_kept_in_range"] == 27
          assert len(archived) == len(expected)
          assert [url for _, url in archived] == [row["url"] for row in expected]
          assert [int(row["original_position_in_11367"]) for row in kept] == report["kept_turkish_positions"]
          assert report["previous_backup"] - report["foreign_archived"] == report["remaining_backup"]
          print("5252 archive URLs match decisions in order; 27 kept decisions verified")
          PY
      - name: 6 - Gercek kanal dosyalarinin degismedigini dogrula
        run: |
          set -euo pipefail
          test -f CALISANLAR.m3u
          test -f YABANCI_KANALLAR.m3u
          test -f scripts/apply_ibo_3_5281.py
          test -f tools/workflow_failure_gate.py
          git diff --exit-code
          echo "Protected playlists unchanged; main write not attempted."
