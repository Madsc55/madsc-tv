name: MADSC - Guvenli Kanal Ayirma ve Yedek Dogrulama Testi
on:
  workflow_dispatch:
  push:
    branches:
      - madsc/p0-guvenli-yazma-kapisi-deneme-20261015
    paths:
      - '.github/workflows/madsc-ibo-3-5281.yml'
permissions:
  contents: read
concurrency:
  group: madsc-p0-ibo-3-5281-rehearsal
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 1 - Deneme dalini ve yazma iznini denetle
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "madsc/p0-guvenli-yazma-kapisi-deneme-20261015"
          echo "Read-only rehearsal. No protected data is modified."
      - name: 2 - Kanal ayirma betiginin kodunu dogrula
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path("scripts/apply_ibo_3_5281.py").read_text(encoding="utf-8"))
          print("IBO writer script syntax OK; script not executed")
          PY
      - name: 3 - 11367 sahte yedekle kanal ayirmayi sinama
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          source = root / "CALISANLAR.m3u"
          before = hashlib.sha256(source.read_bytes()).hexdigest()
          with tempfile.TemporaryDirectory() as temp:
              sandbox = Path(temp)
              (sandbox / "scripts").mkdir()
              (sandbox / "madsc_kesif").mkdir()
              # Historical 11367-entry layout is required by this one-time writer.
              # Build a synthetic fixture; never invent or rewrite real channel data.
              fixture = ["#EXTM3U\n"]
              for position in range(1, 11368):
                  fixture.append(
                      f'#EXTINF:-1 group-title="📦 YEDEKLER (11367)",Synthetic backup {position}\n'
                  )
                  fixture.append(f'https://example.invalid/backup/{position}\n')
              (sandbox / "CALISANLAR.m3u").write_text(
                  "".join(fixture), encoding="utf-8"
              )
              shutil.copy2(root / "scripts/apply_ibo_3_5281.py", sandbox / "scripts/apply_ibo_3_5281.py")
              result = subprocess.run(
                  [sys.executable, "scripts/apply_ibo_3_5281.py"],
                  cwd=sandbox, capture_output=True, text=True,
              )
              if result.returncode != 0:
                  print(result.stdout)
                  print(result.stderr)
                  raise SystemExit("Disposable-copy IBO simulation failed")
              for name in ("ibo_3_5281_ayrilanlar.m3u", "ibo_3_5281_kararlar.csv", "ibo_3_5281_rapor.json"):
                  if not (sandbox / "madsc_kesif" / name).is_file():
                      raise SystemExit("Missing simulation artifact: " + name)
              print("IBO transformation succeeded on synthetic 11367-entry disposable fixture only")
          after = hashlib.sha256(source.read_bytes()).hexdigest()
          if before != after:
              raise SystemExit("Protected source playlist changed")
          print("Protected repository playlist SHA256 unchanged")
          PY
      - name: 4 - Tarihsel ve guncel kanal listesi surumlerini dogrula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          refs = {
              "11367-yedek-geri-yukleme": "b5ce4a752104",
              "ilk-ibo-karar-uygulamasi": "2c5bbe376a20",
              "ibo-arsivleme": "a40e0df02d7a",
              "guncel-iki-yedek": "d647b05a0137",
          }
          expected = {
              "11367-yedek-geri-yukleme": "5fc6213b81cef58670d38aa5f863d01afde981c9",
              "ilk-ibo-karar-uygulamasi": "18a15d34e1e4e14f7b5d9fd6340e9f4e6e01363a",
              "ibo-arsivleme": "37479c66150636e3d1ab0ca92bf28129513f6f65",
              "guncel-iki-yedek": "b40aaf6615b120eac7bd936ccf022dc4a14025ae",
          }
          for label, ref in refs.items():
              url = f"https://api.github.com/repos/{repo}/contents/CALISANLAR.m3u?ref={ref}"
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
              })
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)
              if data["sha"] != expected[label]:
                  raise SystemExit("Historical blob SHA mismatch: " + label)
              print(label + ": original Git blob verified")
          source = Path("CALISANLAR.m3u")
          print("Current playlist SHA256: " + hashlib.sha256(source.read_bytes()).hexdigest())
          PY
      - name: 5 - Arsiv kayitlarini karar dosyasiyla tek tek karsilastir
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path("madsc_kesif")
          report = json.loads((root / "ibo_3_5281_rapor.json").read_text(encoding="utf-8"))
          decisions = list(csv.DictReader((root / "ibo_3_5281_kararlar.csv").open(encoding="utf-8", newline="")))
          archive = (root / "ibo_3_5281_ayrilanlar.m3u").read_text(encoding="utf-8-sig").splitlines()
          assert archive[0] == "#EXTM3U"
          archived = [(archive[i], archive[i+1]) for i in range(1, len(archive), 2)]
          expected = [row for row in decisions if row["action"] == "ARSIVE_ALINDI"]
          kept = [row for row in decisions if row["action"] == "YEDEKLERDE_KALDI"]
          assert len(decisions) == 5279, "Decision count mismatch"
          assert len(expected) == report["foreign_archived"] == 5252
          assert len(kept) == report["turkish_kept_in_range"] == 27
          assert len(archived) == len(expected)
          assert [url for _, url in archived] == [row["url"] for row in expected]
          assert [int(row["original_position_in_11367"]) for row in kept] == report["kept_turkish_positions"]
          assert report["previous_backup"] - report["foreign_archived"] == report["remaining_backup"]
          print("5252 archive URLs match decisions in order; 27 kept decisions verified")
          PY
      - name: 6 - Diger alti arsiv dosyasinin kayit sayilarini dogrula
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("madsc_kesif")
          cases = [
              ("ibo_6115_ikinci_ayrilanlar.m3u", "ibo_6115_ikinci_rapor.json", "foreign_archived", 5585),
              ("ibo_530_399_sonrasi_yabanci_arsiv.m3u", "ibo_530_399_sonrasi_rapor.json", "archived", 132),
              ("ibo_398_16_49_yabanci_arsiv.m3u", "ibo_398_16_49_rapor.json", "archived", 34),
              ("ibo_364_355_364_yabanci_arsiv.m3u", "ibo_364_355_364_rapor.json", "archived", 10),
              ("ibo_354_3_334_turk_calismaz_arsiv.m3u", "ibo_354_iki_kategori_rapor.json", "turkish_user_reported_not_working", 332),
              ("ibo_354_335_354_yabanci_arsiv.m3u", "ibo_354_iki_kategori_rapor.json", "foreign_user_identified", 20),
          ]
          for archive_name, report_name, field, expected in cases:
              lines = (root / archive_name).read_text(encoding="utf-8-sig").splitlines()
              assert lines and lines[0].startswith("#EXTM3U"), archive_name
              entries = sum(line.startswith("#EXTINF") for line in lines)
              urls = sum(line.startswith(("http://", "https://")) for line in lines)
              report = json.loads((root / report_name).read_text(encoding="utf-8"))
              recorded = report[field]
              if isinstance(recorded, dict):
                  recorded = recorded["count"]
              assert entries == urls == expected == recorded, (archive_name, entries, urls, recorded)
              print(archive_name, "verified:", entries)
          PY
      - name: 7 - Otomatik baslatma ve yazma engelini denetle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          raw = Path(".github/workflows/madsc-ibo-3-5281.yml").read_text(encoding="utf-8")
          assert "workflow_dispatch:" in raw
          assert "push:" in raw
          assert "madsc/p0-guvenli-yazma-kapisi-deneme-20261015" in raw
          assert re.search(r"(?m)^  contents: read\s*$", raw)
          assert "persist-credentials: false" in raw
          assert re.search(r"(?m)^concurrency:\s*$", raw)
          assert "cancel-in-progress: false" in raw
          assert not re.search(r"(?m)^  contents: write\s*$", raw)
          assert not re.search(r"(?m)^  schedule:\s*$", raw)
          assert not re.search(r"(?m)^  workflow_run:\s*$", raw)
          print("Isolated auto-trigger guardrails verified; production auto-write remains disabled")
          PY
      - name: 8 - Izinsiz dosya degisikligini engelleyen kapinin denemesi
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path

          protected = ("CALISANLAR.m3u", "AGENTS.md", "GUVENLIK_KURALLARI.md")
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              subprocess.run(["git", "init", "-q"], cwd=root, check=True)
              subprocess.run(["git", "config", "user.email", "test@example.invalid"], cwd=root, check=True)
              subprocess.run(["git", "config", "user.name", "Guvenlik Testi"], cwd=root, check=True)
              for name in protected:
                  (root / name).write_text("korunan-orijinal\\n", encoding="utf-8")
              subprocess.run(["git", "add", "--", *protected], cwd=root, check=True)
              subprocess.run(["git", "commit", "-qm", "baseline"], cwd=root, check=True)

              def gate():
                  return subprocess.run(
                      ["git", "diff", "--quiet", "HEAD", "--", *protected],
                      cwd=root, check=False
                  ).returncode == 0

              assert gate(), "Clean fixture unexpectedly blocked"
              (root / "CALISANLAR.m3u").write_text("izinsiz-degisiklik\\n", encoding="utf-8")
              assert not gate(), "Unauthorized playlist write was not blocked"
              (root / "CALISANLAR.m3u").write_text("korunan-orijinal\\n", encoding="utf-8")
              assert gate(), "Restored fixture did not pass"
              (root / "GUVENLIK_KURALLARI.md").write_text("izinsiz-kural-degisikligi\\n", encoding="utf-8")
              assert not gate(), "Unauthorized security rules write was not blocked"
              print("Guard rejected unauthorized changes in disposable Git fixture")
          PY
      - name: 9 - Gercek is akisinda zorunlu yazma kapisini uygula
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          protected = (
              "CALISANLAR.m3u", "AGENTS.md", "GUVENLIK_KURALLARI.md",
              "YENILER.m3u", "YABANCI_KANALLAR.m3u",
          )
          tracked = [name for name in protected if Path(name).is_file()]
          assert tracked, "No protected paths available"
          result = subprocess.run(
              ["git", "diff", "--exit-code", "HEAD", "--", *tracked],
              check=False, capture_output=True, text=True
          )
          if result.returncode:
              raise SystemExit("BLOCKED: protected files differ from HEAD")
          print("PASS: protected files match HEAD; no unauthorized writes")
          PY
      - name: 10 - Eski otomasyonlarin dogrudan ana dala yazma riskini denetle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".github/workflows")
          legacy = (
              "madsc-11599-yedek-geri-yukle.yml",
              "epg-gunluk.yml",
          )
          for filename in legacy:
              content = (root / filename).read_text(encoding="utf-8")
              writes = "contents: write" in content
              pushes = bool(re.search(r"git\s+push", content))
              if not writes or not pushes:
                  raise SystemExit("Review legacy write policy: " + filename)
              print("PRODUCTION RISK STILL OPEN:", filename)
          safe = (root / "madsc-ibo-354-classify.yml").read_text(encoding="utf-8")
          assert "contents: read" in safe and "git push" not in safe
          print("354 historical writer now read-only; remaining legacy writers still risky")
          PY
      - name: 11 - Tek seferlik ve surekli otomasyonlari ayir
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path(".github/workflows")
          once = (
              "madsc-11599-yedek-geri-yukle.yml",
              "madsc-ibo-354-classify.yml",
          )
          recurring = (
              "epg-gunluk.yml",
              "vod-guncelle.yml",
          )
          event_driven = ("publish-iptv-png-logos.yml",)
          for filename in once:
              raw = (root / filename).read_text(encoding="utf-8")
              assert "schedule:" not in raw, filename
              if filename == "madsc-ibo-354-classify.yml":
                  assert "git push" not in raw and "contents: read" in raw
                  print("TARIHSEL 354 SALT OKUNUR:", filename)
              else:
                  assert ("git push" in raw or "push origin HEAD:main" in raw), filename
                  print("TARIHSEL TEK SEFERLIK - YENIDEN CALISTIRMA:", filename)
          for filename in recurring:
              raw = (root / filename).read_text(encoding="utf-8")
              assert "schedule:" in raw, filename
              assert "contents: write" in raw, filename
              print("SUREKLI - GUVENLI YAZMA KAPISI GEREKIR:", filename)
          for filename in event_driven:
              raw = (root / filename).read_text(encoding="utf-8")
              assert "push:" in raw and "schedule:" not in raw, filename
              assert "contents: write" in raw, filename
              print("OLAYA BAGLI - GUVENLI YAZMA KAPISI GEREKIR:", filename)
          PY
      - name: 12 - EPG ve VOD icin izinli dosya yazma kapisini sina
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path

          allowed = {
              "epg": {"epg/madsc-epg.xml", "epg/ibo-test-epg.xml", "epg/report.json", "epg/tv_kontrol_bekliyor.json"},
              "vod": {"vod/guncel-bolumler.json"},
          }
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              subprocess.run(["git", "init", "-q"], cwd=root, check=True)
              subprocess.run(["git", "config", "user.email", "test@example.invalid"], cwd=root, check=True)
              subprocess.run(["git", "config", "user.name", "Guvenlik Testi"], cwd=root, check=True)
              paths = sorted(set().union(*allowed.values()) | {"CALISANLAR.m3u", "AGENTS.md"})
              for path in paths:
                  target = root / path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text("original\\n", encoding="utf-8")
              subprocess.run(["git", "add", "--all"], cwd=root, check=True)
              subprocess.run(["git", "commit", "-qm", "baseline"], cwd=root, check=True)

              def changed():
                  output = subprocess.check_output(
                      ["git", "status", "--porcelain", "--untracked-files=all"], cwd=root, text=True
                  )
                  return {line[3:] for line in output.splitlines()}

              def gate(kind):
                  modifications = changed()
                  return bool(modifications) and modifications <= allowed[kind]

              (root / "epg/report.json").write_text("new\\n", encoding="utf-8")
              assert gate("epg"), "Permitted EPG output blocked"
              assert not gate("vod"), "EPG output leaked into VOD allowance"
              (root / "CALISANLAR.m3u").write_text("unauthorized\\n", encoding="utf-8")
              assert not gate("epg"), "Protected playlist change was allowed"
              (root / "CALISANLAR.m3u").write_text("original\\n", encoding="utf-8")
              (root / "epg/report.json").write_text("original\\n", encoding="utf-8")
              (root / "vod/guncel-bolumler.json").write_text("new\\n", encoding="utf-8")
              assert gate("vod"), "Permitted VOD output blocked"
              (root / "AGENTS.md").write_text("unauthorized\\n", encoding="utf-8")
              assert not gate("vod"), "Protected policy change was allowed"
              print("EPG/VOD allowlists tested with permitted and forbidden disposable changes")
          PY
      - name: 13 - Gercek EPG ve VOD is akislarinin yazma hedeflerini dogrula
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import shlex
          from pathlib import Path

          expected = {
              "epg-gunluk.yml": {
                  "epg/madsc-epg.xml", "epg/ibo-test-epg.xml",
                  "epg/report.json", "epg/tv_kontrol_bekliyor.json",
              },
              "vod-guncelle.yml": {"vod/guncel-bolumler.json"},
          }
          for filename, allowlist in expected.items():
              raw = (Path(".github/workflows") / filename).read_text(encoding="utf-8")
              adds = re.findall(r"(?m)^[ ]*git add (.+)$", raw)
              assert len(adds) == 1, (filename, "unexpected git add count", adds)
              actual = set(shlex.split(adds[0])) - {"--"}
              assert actual == allowlist, (filename, "allowlist mismatch", actual ^ allowlist)
              assert "contents: write" in raw and "schedule:" in raw, filename
              assert ("git push" in raw or "push origin HEAD:main" in raw), filename
              if filename == "vod-guncelle.yml":
                  assert "concurrency:" in raw and "workflow_failure_gate.py" in raw
                  print("VOD ISOLATED FIX CHECKED:", sorted(actual))
              else:
                  assert not re.search(r"(?m)^concurrency:[ ]*$", raw), filename
                  assert "workflow_failure_gate.py" not in raw, filename
                  print("EPG LIVE GAP:", sorted(actual))
          PY
      - name: 14 - EPG ve VOD cift calisma korumasini denetle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path(".github/workflows")
          candidates = {
              "epg-gunluk.yml": "madsc-epg-tek-kosu",
              "vod-guncelle.yml": "madsc-vod-tek-kosu",
          }
          for filename, group in candidates.items():
              live = (root / filename).read_text(encoding="utf-8")
              assert "schedule:" in live and "workflow_dispatch:" in live, filename
              if filename == "vod-guncelle.yml":
                  assert "concurrency:" in live and "cancel-in-progress: false" in live
              else:
                  assert "concurrency:" not in live, "Unexpected live concurrency: " + filename
              proposed = (
                  "concurrency:\n"
                  "  group: " + group + "\n"
                  "  cancel-in-progress: false\n"
              )
              assert proposed.count("concurrency:") == 1
              assert "cancel-in-progress: false" in proposed
              assert "github.run_id" not in proposed and "github.event_name" not in proposed
              print("SAFE PROPOSED GROUP:", filename, group)
              print("LIVE GAP: concurrency missing; proposal not applied")
          assert len(set(candidates.values())) == len(candidates)
          print("Independent stable EPG/VOD groups checked; no production change")
          PY
      - name: 15 - EPG ve VOD guvenli kaydetme kapisini sina
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path

          allowed = {
              "epg": {"epg/report.json", "epg/madsc-epg.xml"},
              "vod": {"vod/guncel-bolumler.json"},
          }
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              def git(*args, check=True):
                  return subprocess.run(
                      ["git", *args], cwd=root, check=check, capture_output=True, text=True
                  )
              git("init", "-q")
              git("config", "user.email", "test@example.invalid")
              git("config", "user.name", "Guvenlik Testi")
              for name in sorted(set().union(*allowed.values()) | {"CALISANLAR.m3u"}):
                  target = root / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text("original", encoding="utf-8")
              git("add", "--all")
              git("commit", "-qm", "baseline")

              def gate(kind):
                  status = git("status", "--porcelain", "--untracked-files=all").stdout
                  paths = {line[3:] for line in status.splitlines()}
                  return bool(paths) and paths <= allowed[kind]

              (root / "epg/report.json").write_text("updated", encoding="utf-8")
              assert gate("epg")
              git("add", "--", "epg/report.json")
              assert gate("epg"), "Staged permitted output rejected"
              (root / "CALISANLAR.m3u").write_text("forbidden", encoding="utf-8")
              assert not gate("epg"), "Unauthorized unstaged change escaped"
              git("add", "--", "CALISANLAR.m3u")
              assert not gate("epg"), "Unauthorized staged change escaped"
              git("restore", "--staged", "--worktree", "CALISANLAR.m3u")
              assert gate("epg"), "Recovery of protected file did not restore gate"
              git("commit", "-qm", "permitted EPG only")
              assert not git("status", "--porcelain").stdout
              assert git("show", "--pretty=format:", "--name-only", "HEAD").stdout.strip() == "epg/report.json"

              (root / "vod/guncel-bolumler.json").write_text("updated", encoding="utf-8")
              assert gate("vod")
              assert not gate("epg"), "Cross-task output escaped gate"
              print("EPG/VOD staged and unstaged allowlists, commit scope, cross-task isolation verified")
              print("No remote push attempted; production push and rebase still require separate checks")
          PY
      - name: 16 - Uzak dal degisiklikleri icin korunan dosya denetimini sina
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              def git(*args):
                  return subprocess.run(["git", *args], cwd=root, check=True, capture_output=True, text=True).stdout.strip()
              git("init", "-q")
              git("config", "user.email", "test@example.invalid")
              git("config", "user.name", "Guvenlik Testi")
              for name in ("CALISANLAR.m3u", "epg/report.json"):
                  path = root / name
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text("baseline", encoding="utf-8")
              git("add", "--all")
              git("commit", "-qm", "baseline")
              baseline = git("rev-parse", "HEAD")
              (root / "CALISANLAR.m3u").write_text("external change", encoding="utf-8")
              git("add", "--all")
              git("commit", "-qm", "remote simulation")
              changed = set(git("diff", "--name-only", baseline, "HEAD").splitlines())
              assert "CALISANLAR.m3u" in changed
              assert not changed <= {"epg/report.json"}
              print("Protected change between baseline and simulated remote head: BLOCK")
              print("No remote network or production write attempted")
          PY
      - name: 17 - Eski surumde guvenli yeniden deneme kararini sina
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              def git(*args):
                  return subprocess.run(["git", *args], cwd=root, check=True,
                                        capture_output=True, text=True).stdout.strip()
              git("init", "-q")
              git("config", "user.email", "test@example.invalid")
              git("config", "user.name", "Guvenlik Testi")
              (root / "epg").mkdir()
              (root / "epg/report.json").write_text("base", encoding="utf-8")
              (root / "CALISANLAR.m3u").write_text("base", encoding="utf-8")
              git("add", "--all")
              git("commit", "-qm", "base")
              base = git("rev-parse", "HEAD")

              def retry_decision(old, new, allowed):
                  if old == new:
                      return "UNCHANGED"
                  changed = set(git("diff", "--name-only", old, new).splitlines())
                  return "REVIEW" if changed <= allowed else "BLOCK"

              (root / "epg/report.json").write_text("new report", encoding="utf-8")
              git("add", "--all")
              git("commit", "-qm", "allowed remote update")
              permitted = git("rev-parse", "HEAD")
              assert retry_decision(base, permitted, {"epg/report.json"}) == "REVIEW"
              assert retry_decision(permitted, permitted, {"epg/report.json"}) == "UNCHANGED"
              (root / "CALISANLAR.m3u").write_text("unexpected channel update", encoding="utf-8")
              git("add", "--all")
              git("commit", "-qm", "protected remote update")
              unsafe = git("rev-parse", "HEAD")
              assert retry_decision(base, unsafe, {"epg/report.json"}) == "BLOCK"
              assert retry_decision(permitted, unsafe, {"epg/report.json"}) == "BLOCK"
              assert retry_decision(base, unsafe, {"vod/guncel-bolumler.json"}) == "BLOCK"
              print("Unchanged head: no retry; allowed remote changes: manual review")
              print("Protected or cross-task remote changes: fail closed")
              print("No network, rebase, or production write attempted")
          PY
