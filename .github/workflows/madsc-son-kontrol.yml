name: MADSC - Tamamlanan Aday Son Kontrol
on:
  push:
    branches: [main]
    paths:
      - 'final_validation.py'
      - '.github/workflows/madsc-son-kontrol.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'MADSC - Üç Aşamalı Aday Doğrulama'
    types: [completed]
permissions:
  contents: write
  actions: write
concurrency:
  group: madsc-son-kontrol
  cancel-in-progress: false
jobs:
  continuity:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Depo dosyalarını al
        uses: actions/checkout@v4
      - name: 24. kural - ardışık hata güvenlik kontrolü
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/workflow_failure_gate.py
      - name: Güncel kodu ve sabit aday grubunu yükle
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Test kanıtı kurallarını doğrula
        run: python3 -m unittest test_final_validation -v
      - name: Yayın çözümleyicisini kur
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Beş dakikalık görüntü ses sürekliliğini doğrula
        run: python3 final_validation.py
      - name: Test çıktılarını arşivle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: madsc-son-kontrol-goruntuler
          path: madsc_son_kontrol/
          retention-days: 30
      - name: Yalnızca ayrı test raporlarını kaydet
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- CALISANLAR.m3u madsc_dogrulama/ madsc_kesif/ yedekler/
          mkdir -p "${RUNNER_TEMP}/son-kontrol"
          cp madsc_son_kontrol/results.json madsc_son_kontrol/summary.json "${RUNNER_TEMP}/son-kontrol/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 10); do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p madsc_son_kontrol
            cp "${RUNNER_TEMP}/son-kontrol/"*.json madsc_son_kontrol/
            git add -- madsc_son_kontrol/results.json madsc_son_kontrol/summary.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Save separate completed-candidate continuity report"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

      - name: Doğrulanmış adayları yalnızca YEDEKLER kategorisine aktar
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/son_kontrol_yedekler_aktar.py
          if git diff --quiet -- CALISANLAR.m3u; then
            echo "Kimliği doğrulanmış yeni aday yok; liste korunuyor."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 10); do
            git fetch origin main
            git reset --hard origin/main
            python3 tools/yedekler_guvenli_ekle.py
            git add -- CALISANLAR.m3u
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Append verified candidates to YEDEKLER only"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

      - name: Kalan son kontrolleri otomatik sürdür
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remaining=$(python3 -c 'import json; print(json.load(open("madsc_son_kontrol/summary.json"))["remaining"])')
          echo "Remaining unreviewed final-check candidates: $remaining"
          if [ "$remaining" -gt 0 ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/madsc-son-kontrol.yml/dispatches" -f ref=main
            echo "Next 200-candidate final-check batch queued."
          else
            echo "All currently eligible final checks completed."
          fi
