name: MADSC - Tamamlanan Aday Son Kontrol
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/madsc-son-kontrol.yml'
permissions:
  contents: write
concurrency:
  group: madsc-son-kontrol
  cancel-in-progress: false
jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Load current code and frozen priority batch
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Test evidence rules
        run: python3 -m unittest test_final_validation -v
      - name: Install decoder
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Five minute video audio continuity and image evidence
        run: python3 final_validation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: madsc-son-kontrol-goruntuler
          path: madsc_son_kontrol/
          retention-days: 30
      - name: Save separate reports only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- CALISANLAR.m3u madsc_dogrulama/ madsc_kesif/ yedekler/
          mkdir -p "${RUNNER_TEMP}/son-kontrol"
          cp madsc_son_kontrol/results.json madsc_son_kontrol/summary.json "${RUNNER_TEMP}/son-kontrol/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 10); do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p madsc_son_kontrol
            cp "${RUNNER_TEMP}/son-kontrol/"*.json madsc_son_kontrol/
            git add -- madsc_son_kontrol/results.json madsc_son_kontrol/summary.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Save separate completed-candidate continuity report"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
