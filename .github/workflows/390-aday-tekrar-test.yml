name: 390 Aday Hizli Teknik Tekrar Test
on:
  workflow_dispatch:
  push:
    paths:
      - 'yedekler/tekrar_test_390.py'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Parallel 20-second video and audio tests
        env:
          TEST_WORKERS: '10'
        run: python3 yedekler/tekrar_test_390.py
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 390-aday-tekrar-test
          if-no-files-found: warn
          path: |
            yedekler/TEKRAR_TEST_2026-10-09.csv
            yedekler/TEKNIK_DOGRULANANLAR_2026-10-09.m3u
