name: Sozcu Akit Ozel Test
on:
  workflow_dispatch:
  push:
    paths:
      - 'yedekler/sozcu_akit_ozel_test.py'
      - '.github/workflows/sozcu-akit-ozel-test.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Test candidate links
        run: python3 -u yedekler/sozcu_akit_ozel_test.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sozcu-akit-ozel-test
          if-no-files-found: warn
          path: yedekler/SOZCU_AKIT_OZEL_TEST_2026-10-09.csv
      - name: Commit test results only
        if: success()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add yedekler/SOZCU_AKIT_OZEL_TEST_2026-10-09.csv
          git diff --cached --quiet || (git commit -m "Save Sozcu Akit technical test results" && git push)
