name: "TOPLU - IPTV Sistem Saglik ve Guvenlik Kontrolu"
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/toplu-sistem-kontrol.yml"
permissions:
  contents: read
jobs:
  comprehensive:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependency
        run: python -m pip install --quiet pyyaml
      - name: Complete repository audit and sample stream reachability
        run: |
          python - <<'PY'
          import ast,hashlib,json,re,urllib.request,urllib.error
          from pathlib import Path
          import yaml
          report={"errors":[],"warnings":[],"inventory":{},"stream_probes":[],"limits":["HTTP reachability is not playback verification","No IBO Player or Sweden geo-playback verification","Scripts may write local runner files; repository has read-only token"]}
          root=Path(".")
          protected=[Path("CALISANLAR.m3u"),Path("YENILER.m3u")]
          baseline={}
          for p in protected:
              if not p.exists():report["errors"].append(f"Missing protected file: {p}")
              else:baseline[str(p)]=hashlib.sha256(p.read_bytes()).hexdigest()
          scripts=list(root.rglob("*.py"))
          report["inventory"]["python_files"]=len(scripts)
          for p in scripts:
              try:ast.parse(p.read_text(encoding="utf-8-sig"),filename=str(p))
              except Exception as e:report["errors"].append(f"Python syntax {p}: {e}")
          workflows=list(Path(".github/workflows").glob("*.yml"))
          report["inventory"]["workflows"]=len(workflows)
          for p in workflows:
              try:
                  raw=p.read_text(encoding="utf-8-sig")
                  obj=yaml.safe_load(raw)
                  if not isinstance(obj,dict) or not isinstance(obj.get("jobs"),dict):report["errors"].append(f"Invalid workflow {p}")
                  permissions=obj.get("permissions",{}) if isinstance(obj,dict) else {}
                  if isinstance(permissions,dict) and permissions.get("contents")=="write":report["warnings"].append(f"Review repository writer: {p}")
                  if re.search(r"\bgit\s+push\b",raw) and not p.name.startswith("test-"):report["warnings"].append(f"Review git push: {p}")
              except Exception as e:report["errors"].append(f"Workflow YAML {p}: {e}")
          playlists=list(root.rglob("*.m3u"))
          report["inventory"]["playlists"]=len(playlists)
          report["inventory"]["backup_files"]=sum(p.is_file() for p in Path("yedekler").rglob("*"))
          for p in playlists:
              try:
                  lines=p.read_text(encoding="utf-8-sig").splitlines()
                  if not lines or not lines[0].lstrip().startswith("#EXTM3U"):report["errors"].append(f"Invalid M3U header: {p}")
                  entries=[i for i,s in enumerate(lines) if s.startswith("#EXTINF:")]
                  report["inventory"][str(p)+"_channels"]=len(entries)
                  for i in entries:
                      j=i+1
                      while j<len(lines) and not lines[j].strip():j+=1
                      if j>=len(lines) or lines[j].startswith("#"):report["errors"].append(f"Missing URL: {p}:{i+1}")
              except Exception as e:report["errors"].append(f"Playlist parse {p}: {e}")
          for p in protected:
              if not p.exists():continue
              lines=p.read_text(encoding="utf-8-sig").splitlines()
              count=0
              for i,line in enumerate(lines):
                  if not line.startswith("#EXTINF:"):continue
                  url=next((v.strip() for v in lines[i+1:] if v.strip() and not v.startswith("#")),None)
                  if not url or not url.startswith(("http://","https://")):continue
                  if count>=8:break
                  count+=1
                  outcome={"playlist":str(p),"channel":line.split(",",1)[-1][:90],"result":"inconclusive"}
                  try:
                      request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Range":"bytes=0-1023"})
                      with urllib.request.urlopen(request,timeout=5) as response:
                          payload=response.read(1024)
                          outcome["result"]="reachable" if 200<=response.status<300 and payload else "inconclusive"
                  except urllib.error.HTTPError as e:outcome.update(result="http_error",http_code=e.code)
                  except Exception:outcome["result"]="network_error"
                  report["stream_probes"].append(outcome)
          for p in protected:
              if p.exists() and baseline.get(str(p))!=hashlib.sha256(p.read_bytes()).hexdigest():report["errors"].append(f"Protected file changed during audit: {p}")
          report["status"]="FAIL" if report["errors"] else "PASS_WITH_WARNINGS" if report["warnings"] else "PASS"
          Path("TOPLU_SISTEM_RAPORU.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps({"status":report["status"],"inventory":report["inventory"],"errors":report["errors"],"warnings":report["warnings"],"stream_probes":report["stream_probes"]},ensure_ascii=False,indent=2))
          if report["errors"]:raise SystemExit(1)
          PY
      - name: Run all existing unit tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m unittest discover -s . -p 'test_*.py' -v
      - name: Preserve one consolidated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MADSC-TEK-TOPLU-SISTEM-RAPORU
          path: TOPLU_SISTEM_RAPORU.json
          if-no-files-found: warn
