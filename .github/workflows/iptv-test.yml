name: IPTV Salt Okunur Kanal Testi

on:
  workflow_dispatch:

concurrency:
  group: madsc-iptv-test
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-ve-guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4
        with:
          ref: main

      - name: FFmpeg kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Kanallari test et
        run: python3 iptv_test.py "MADSC_TV_47_LISTE_ADAY.m3u"

      - name: Test sonuclarini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MADSC-IPTV-TEST-SONUCLARI
          path: |
            CALISANLAR.m3u
            CALISMAYANLAR.txt
            TEST_RAPORU.csv
          retention-days: 30
