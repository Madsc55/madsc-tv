name: "19 - Butunlesik Guvenli Kontrol"
on:
  push:
    paths:
      - ".github/workflows/test-19-integration.yml"
      - "tools/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read-only integration checks
        run: |
          python - <<'PY'
          import datetime as dt
          import hashlib
          import json
          from pathlib import Path
          from tools.channel_stability import report
          from tools.logo_epg_audit import audit
          from tools.workflow_safety import redact, bounded_retry
          from tools.candidate_status_summary import summarize
          from tools.change_simulation import simulate
          protected = ['CALISANLAR.m3u', 'YENILER.m3u']
          before = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in protected}
          sample = '#EXTM3U\n#EXTINF:-1 tvg-id="demo.tr" tvg-logo="https://example.org/logo.png",Demo TV\nhttps://example.org/live\n'
          assert audit(sample)['channels_checked'] == 1
          assert not audit(sample)['warnings']
          assert summarize([{'status':'yeni'}, {'status':'verified'}])['total'] == 2
          assert '[REDACTED]' in redact('https://example.org/live?token=secret')
          assert bounded_retry(lambda: 'ok', attempts=1) == 'ok'
          now = dt.datetime.now(dt.timezone.utc)
          stability = report([{'channel':'Demo TV', 'timestamp':now.isoformat(), 'success':True}], now=now)
          assert stability['channels'][0]['days_7']['passed'] == 1
          plan = simulate(sample, sample + '#EXTINF:-1,Extra\nhttps://example.org/extra\n')
          assert plan['applied'] is False and plan['channel_count_delta'] == 1
          after = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in protected}
          assert before == after, 'Protected playlists changed'
          print(json.dumps({'integration':'passed','protected_files_unchanged':True,'checks':5}))
          PY