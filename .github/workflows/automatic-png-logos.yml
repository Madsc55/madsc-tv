name: Eksik Kanal Logolari Guvenli Hazirlik
on:
  workflow_dispatch:
  push:
    paths:
      - 'CALISANLAR.m3u'
      - 'scripts/automatic_png_logos.py'
      - '.github/workflows/automatic-png-logos.yml'
permissions:
  contents: write
concurrency:
  group: automatic-png-logos
  cancel-in-progress: false
jobs:
  png:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow cairosvg
      - run: python logo_deneme/audit.py
      - run: python scripts/automatic_png_logos.py
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python scripts/logo_visual_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: logo-visual-evidence
          path: logo_deneme/visual_frames/
          if-no-files-found: ignore
      - name: Korunan kanal listesi degisikliklerini engelle
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- CALISANLAR.m3u; then
            echo "::warning::CALISANLAR.m3u degisikligi tespit edildi; ana listeye kaydedilmeyecek."
            git restore -- CALISANLAR.m3u
          fi
          if ! git diff --cached --quiet -- CALISANLAR.m3u; then
            echo "::error::Korunan kanal listesi stage alaninda degistirilmis."
            exit 1
          fi
      - name: Logo calismasi sonucunu guvenli artifact olarak sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logo-hazirlik-ve-inceleme
          path: |
            logos/auto/
            logo_deneme/ozet.json
            logo_deneme/rapor.json
            logo_deneme/visual_review.json
            logo_deneme/png_automation.json
          if-no-files-found: warn
          retention-days: 30
