name: Automatically fill missing channel logos
on:
  schedule:
    - cron: '23 5,17 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'CALISANLAR.m3u'
      - 'scripts/automatic_png_logos.py'
      - '.github/workflows/automatic-png-logos.yml'
permissions:
  contents: write
concurrency:
  group: automatic-png-logos
  cancel-in-progress: false
jobs:
  png:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow cairosvg
      - run: python scripts/automatic_png_logos.py
      - run: python logo_deneme/audit.py
      - name: Save PNG artwork and logo-only playlist changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CALISANLAR.m3u logo_deneme/ozet.json logo_deneme/rapor.json
          if [ -d logos/auto ]; then git add logos/auto; fi
          if [ -f logo_deneme/png_automation.json ]; then git add logo_deneme/png_automation.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Automatically cache playlist artwork as PNG and audit logos'
            git push
          fi
