name: MADSC - Historical 6115-second Decision Read-only Review
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: madsc-historical-6115-second-review
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify original decision source without replay
        run: |
          set -euo pipefail
          test -f scripts/apply_ibo_6115_second.py
          test -f CALISANLAR.m3u
          git diff --exit-code -- CALISANLAR.m3u
