name: Yedek Kanal Kalite Tespiti
on:
  workflow_dispatch:
  push:
    paths:
      - 'yedekler/ibo_yedek_kalite_tespit.py'
      - '.github/workflows/ibo-yedek-kalite.yml'
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Measure backup streams
        run: python3 -u yedekler/ibo_yedek_kalite_tespit.py
      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibo-yedek-kalite
          path: yedekler/IBO_YEDEK_KALITE_RAPORU_2026-10-09.csv
          if-no-files-found: warn
      - name: Commit only backup display names and report
        if: success()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add CALISANLAR.m3u yedekler/IBO_YEDEK_KALITE_RAPORU_2026-10-09.csv
          git diff --cached --quiet || (git commit -m "Annotate measured quality of IBO backup streams" && git push)
