name: K1 - Korunan Yazma Kapisi Guvenlik Testleri
on:
  push:
    paths:
      - '.github/workflows/k1-protected-write-tests.yml'
      - '.github/workflows/madsc-01-guvenlik.yml'
      - 'tools/protected_write_gate.py'
      - 'tests/test_protected_write_gate.py'
      - 'scripts/audit_workflow_security.py'
      - 'tests/test_workflow_security_audit.py'
      - 'tests/test_k1_failure_gate.py'
      - 'tools/workflow_failure_gate.py'
      - 'scripts/k1_workflow_risk_inventory.py'
      - 'scripts/k1_24_rule_evidence.py'
      - 'tests/test_k1_24_rule_evidence.py'
      - 'tests/test_k1_workflow_risk_inventory.py'
      - 'scripts/k1_protected_integrity.py'
      - 'test_five_category_runtime_integrity.py'
      - 'scripts/five_category_92_workflow_audit.py'
      - 'tests/test_five_category_92_workflow_audit.py'
      - '.github/workflows/madsc-ibo-354-classify.yml'
      - '.github/workflows/madsc-birlesik-kesif.yml'
      - 'tests/test_k1_legacy_writer_guards.py'
      - '.github/workflows/epg-gunluk.yml'
      - '.github/workflows/publish-iptv-png-logos.yml'
      - '.github/workflows/vod-guncelle.yml'
      - '.github/workflows/madsc-02-kesif.yml'
      - '.github/workflows/toplu-sistem-kontrol.yml'
      - '.github/workflows/yedek-geri-yukleme-tatbikat.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  negative-tests:
    name: Guvenlik kurallari toplu negatif testler
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Depoyu salt okunur indir
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python ortamını hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guvenlik test bagimliligini kur
        run: python -m pip install PyYAML
      - name: Kanal listelerine dokunmadan guvenlik negatif testleri
        run: python -m unittest discover -s tests -p 'test_*security_audit.py' -v
      - name: 92 eski workflow guvenlik regresyon testleri
        run: python -m unittest discover -s tests -p 'test_five_category_92_workflow_audit.py' -v
      - name: Korunan dosya yazma kapisi negatif testleri
        run: python -m unittest discover -s tests -p 'test_protected_write_gate.py' -v
      - name: Kural 24 devre kesici negatif testleri
        run: python -m unittest discover -s tests -p 'test_k1_failure_gate.py' -v
      - name: Workflow push risk envanteri regresyon testleri
        run: python -m unittest discover -s tests -p 'test_k1_workflow_risk_inventory.py' -v
      - name: 26 guvenlik kurali kanit matrisi
        run: |
          python -m unittest discover -s tests -p 'test_k1_24_rule_evidence.py' -v
          python scripts/k1_24_rule_evidence.py > k1-26-rule-evidence.json
      - name: Yirmi alti kural kanitini sakla
        uses: actions/upload-artifact@v4
        with:
          name: k1-26-rule-evidence
          path: k1-26-rule-evidence.json
          retention-days: 30
      - name: Eski yazicilarin izin ve koruma regresyon testleri
        run: python -m unittest discover -s tests -p 'test_k1_legacy_writer_guards.py' -v
      - name: Korunan dosya calisma ani regresyon testleri
        run: python3 -m unittest test_five_category_runtime_integrity -v
      - name: Korunan dosyalari ana dal ile karsilastir
        id: protected_integrity
        continue-on-error: true
        run: |
          git fetch --no-tags origin main
          python scripts/k1_protected_integrity.py | tee k1-protected-diff.log
          # Branch-to-main drift is evidence, not a runtime mutation.
          # Runtime protected-file snapshot/check remains enforced in K1-K5.
      - name: Korunan dosya farki kanitini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k1-protected-diff
          path: k1-protected-diff.log
          if-no-files-found: warn
          retention-days: 30
      - name: Tum workflow risk envanterini olustur
        run: |
          python scripts/k1_workflow_risk_inventory.py > k1-workflow-risk-inventory.json
          python -c "import json; r=json.load(open('k1-workflow-risk-inventory.json')); print('Total:',r['workflow_count'],'Tiers:',r['tiers'],'Missing permissions:',r['missing_explicit_permissions']); print('CRITICAL FILES:',[(x['path'],x['git_push_count'],x['gate_reference_count']) for x in r['records'] if x['tier']=='CRITICAL_UNGATED_PUSH']); assert r['workflow_count'] >= 98; assert r['tiers'].get('CRITICAL_UNGATED_PUSH',0) == 0; print('PUSH BEFORE GATE:',r['push_order_review_paths']); print('INDIRECT WITHOUT GATE:',r['indirect_writers_without_gate_reference'])"
      - name: Workflow risk envanterini sakla
        uses: actions/upload-artifact@v4
        with:
          name: k1-workflow-risk-inventory
          path: k1-workflow-risk-inventory.json
          retention-days: 30
      - name: Workflow calistirmadan envanter sayisini dogrula
        run: python -c "from scripts.audit_workflow_security import audit; r=audit(); print('Workflow count:',r['workflow_count']); assert r['workflow_count'] >= 97"
      - name: Korunan dosya farki varsa toplu testi basarisiz bitir
        if: always() && steps.protected_integrity.outcome == 'failure'
        run: |
          echo "::error::Korunan dosyalarda ana dal ile fark var; raporlar toplandi ama guvenlik kapisi acik kaldi."
          exit 1
