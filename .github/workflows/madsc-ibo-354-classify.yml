name: MADSC - YEDEKLER 354 Gecmis Karar Guvenlik Denetimi
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: madsc-ibo-354-tarihsel-salt-okunur
  cancel-in-progress: false
jobs:
  classify:
    name: 354 gecmis siniflandirma - salt okunur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 1 - Gecmis siniflandirma kaynaklarini salt okunur dogrula
        run: |
          set -euo pipefail
          test -f scripts/archive_backups_354_classified.py
          test -f CALISANLAR.m3u
          git diff --exit-code -- CALISANLAR.m3u
          echo "Gecmis 354 siniflandirma yeniden uygulanmadi. Kanal listesi korunuyor."
