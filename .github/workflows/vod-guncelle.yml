name: VOD meta veri guncelleme
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: madsc-protected-publish-main
  cancel-in-progress: false
jobs:
  update:
    name: VOD meta veri guncellemesi ve yazma denetimi
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Python ortamını hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Izinli TV bolum takvimi bilgilerini al
        run: python scripts/vod_guncelle.py
      - name: Yalnizca VOD meta verisini kontrollu kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vod/guncel-bolumler.json
          git diff --cached --quiet || (python3 tools/protected_write_gate.py --base HEAD && git commit -m "Update Turkish TV episode schedule metadata" && git push)
