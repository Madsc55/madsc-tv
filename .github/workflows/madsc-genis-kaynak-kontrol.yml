name: MADSC - Haftalik ve Aylik Genis Kaynak Kontrolu
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: madsc-rapor-yazma
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Rapor başlangıç sürümünü kaydet
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git rev-parse origin/main > "${RUNNER_TEMP}/madsc-rapor-base-sha"
      - name: Check additional sources (manual only)
        env:
          MADSC_SCAN_MODE: weekly
        run: python3 tools/genis_kaynak_taramasi.py
      - name: Check 155 sources (manual only)
        env:
          MADSC_SCAN_MODE: monthly
        run: python3 tools/genis_kaynak_taramasi.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: madsc-source-scan
          path: madsc_genis_tarama/
          retention-days: 30
      - name: Preserve source history and reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -a madsc_genis_tarama "${RUNNER_TEMP}/source-audit"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            # Farkli bir calisma ayni rapor klasorunu degistirdiyse eski kopyayla ustune yazma.
            if ! git diff --quiet "$(cat "${RUNNER_TEMP}/madsc-rapor-base-sha")" origin/main -- madsc_genis_tarama/; then
              echo "::error::Rapor klasoru bu calisma sirasinda degisti; eski sonuclarin uzerine yazilmadi. Artifact saklandi."
              exit 1
            fi
            git reset --hard origin/main
            git checkout -B source-report origin/main
            mkdir -p madsc_genis_tarama
            cp -a "${RUNNER_TEMP}/source-audit/." madsc_genis_tarama/
            git add madsc_genis_tarama/
            if git diff --cached --quiet; then exit 0; fi
            python3 tools/protected_write_gate.py --base origin/main
            git commit -m "Update source change audit"
            python3 tools/protected_write_gate.py --base origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
      - name: Continue with existing three-stage verification (manual source audit only)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/madsc-uc-asama.yml/dispatches" -f ref=main
