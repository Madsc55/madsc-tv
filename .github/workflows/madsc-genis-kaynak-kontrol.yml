name: MADSC - Genis Kaynak Salt Okunur Denetim
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: madsc-genis-kaynak-denetim
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Kaynak taramasi - haftalik mod
        env:
          MADSC_SCAN_MODE: weekly
        run: python3 tools/genis_kaynak_taramasi.py
      - name: Kaynak taramasi - aylik mod
        env:
          MADSC_SCAN_MODE: monthly
        run: python3 tools/genis_kaynak_taramasi.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: madsc-source-scan
          path: madsc_genis_tarama/
          retention-days: 30
      - name: Korunan dosyalari degistirmedigini dogrula
        run: |
          set -euo pipefail
          git diff --exit-code -- CALISANLAR.m3u AGENTS.md GUVENLIK_KURALLARI.md YENILER.m3u YABANCI_KANALLAR.m3u
