name: Publish EPG to GitHub Pages
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['EPG Günlük Güncelleme']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: epg-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate EPG and prepare Pages files
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          epg = Path('epg/madsc-epg.xml')
          root = ET.parse(epg).getroot()
          assert root.tag == 'tv'
          assert len(root.findall('channel')) > 0
          assert len(root.findall('programme')) > 0
          Path('_site').mkdir(exist_ok=True)
          Path('_site/.nojekyll').write_text('')
          Path('_site/index.html').write_text('<!doctype html><title>Madsc TV EPG</title><p>EPG: <a href="madsc-epg.xml">XMLTV</a></p>')
          Path('_site/madsc-epg.xml').write_bytes(epg.read_bytes())
          pilot = Path('epg/ibo-test-epg.xml')
          pilot_root = ET.parse(pilot).getroot()
          assert len(pilot_root.findall('channel')) == 5
          assert len(pilot_root.findall('programme')) > 0
          Path('_site/ibo-test-epg.xml').write_bytes(pilot.read_bytes())
          print(f'Validated {len(root.findall("channel"))} channels and {len(root.findall("programme"))} programmes')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published guide matches prepared XML
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.request
          from pathlib import Path
          expected = hashlib.sha256(Path('epg/madsc-epg.xml').read_bytes()).hexdigest()
          url = os.environ['PAGE_URL'].rstrip('/') + '/madsc-epg.xml'
          last_status = 'NOT_CHECKED'
          for attempt in range(20):
              try:
                  req = urllib.request.Request(
                      url + '?check=' + os.environ['GITHUB_RUN_ID'] + '-' + str(attempt),
                      headers={'Cache-Control': 'no-cache', 'User-Agent': 'MADSC-EPG-verify/1.0'})
                  with urllib.request.urlopen(req, timeout=15) as response:
                      data = response.read(30_000_000)
                  actual = hashlib.sha256(data).hexdigest()
                  if actual == expected:
                      print(json.dumps({'published_url': url, 'sha256': actual,
                                        'bytes': len(data), 'published_matches': True}))
                      break
                  last_status = 'CONTENT_MISMATCH'
              except Exception:
                  last_status = 'FETCH_ERROR'
              if attempt < 19:
                  time.sleep(3)
          else:
              raise RuntimeError('Published EPG check failed: ' + last_status)
          PY
