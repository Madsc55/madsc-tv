name: MADSC - Historical protected audit - madsc-turk-kanal-geri-sec.yml
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: madsc-historical-madsc-turk-kanal-geri-sec
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify protected playlist remains unchanged
        run: |
          set -euo pipefail
          before="$(sha256sum CALISANLAR.m3u | cut -d' ' -f1)"
          git diff --exit-code -- CALISANLAR.m3u
          test "$before" = "$(sha256sum CALISANLAR.m3u | cut -d' ' -f1)"
