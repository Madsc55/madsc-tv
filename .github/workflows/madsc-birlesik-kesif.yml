name: MADSC TV - Birleşik Kanal Keşfi ve Testi
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6,18 * * *'
permissions:
  contents: write
concurrency:
  group: madsc-rapor-yazma
  cancel-in-progress: false
jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Depo dosyalarını al
        uses: actions/checkout@v4
      - name: 24. kural - ardışık hata güvenlik kontrolü
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/workflow_failure_gate.py
      - name: Kuyruk sonrası dal bütünlüğünü doğrula
        run: |
          set -euo pipefail
          echo "Keşif, tetiklendiği commit üzerinde çalışır; main üzerine sıfırlama yapılmaz."
          git rev-parse HEAD
      - name: Kalıcı K2 rapor geçmişini ayrı daldan yükle
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/madsc/k2-discovery-report-store:refs/remotes/origin/madsc/k2-discovery-report-store
          git rev-parse refs/remotes/origin/madsc/k2-discovery-report-store > "${RUNNER_TEMP}/k2-report-base-sha"
          git restore --source=refs/remotes/origin/madsc/k2-discovery-report-store --worktree -- madsc_kesif/
          python3 -m json.tool madsc_kesif/gecmis.json > /dev/null
          test -s madsc_kesif/gecmis.json || { echo "::error::Kalıcı keşif geçmişi eksik"; exit 1; }
          test -s madsc_kesif/bulunan_kanal_arsivi.csv || { echo "::error::Kalıcı keşif arşivi eksik"; exit 1; }
      - name: Yayın kontrol aracını kur
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Python ortamını hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Görüntü işleme araçlarını kur
        run: python -m pip install Pillow cairosvg
      - name: Kalici arsivdeki URLleri tekrar testten koru
        run: python3 scripts/discovery_archive.py before
      - name: Kaynakları tara, tekrarları ayıkla ve adayları test et
        run: python3 madsc_akilli_kesif.py
      - name: Bulunan tum adaylari kalici arsive kaydet
        run: python3 scripts/discovery_archive.py after
      - name: Aday yayın logo ve EPG kanıtlarını tek raporda birleştir
        if: ${{ false }} # EPG ertelendi; eski denetim sozlesmesi icin adim saklandi, CALISTIRILMAZ
        run: python3 scripts/candidate_epg_logo_join.py
      - name: Yedek arsiv kesif ve aday logo kanitlarini tek raporda denetle (EPG ertelendi)
        run: python3 scripts/four_stage_discovery_report.py
      - name: Test çıktılarını arşivle
        uses: actions/upload-artifact@v4
        with:
          name: candidate-logo-pngs
          path: madsc_kesif/candidate_pngs/
          if-no-files-found: ignore
      - name: Test raporlarını arşivle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madsc-kesif-raporu
          path: madsc_kesif/
          retention-days: 30
      - name: Keşif raporlarını yalnızca ayrı K2 arşiv dalına kaydet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -s madsc_kesif/gecmis.json
          test -s madsc_kesif/bulunan_kanal_arsivi.csv
          cp -a madsc_kesif "${RUNNER_TEMP}/k2-new-report"
          git fetch origin refs/heads/madsc/k2-discovery-report-store:refs/remotes/origin/madsc/k2-discovery-report-store
          test "$(cat "${RUNNER_TEMP}/k2-report-base-sha")" = "$(git rev-parse refs/remotes/origin/madsc/k2-discovery-report-store)" || { echo "::error::K2 rapor dalı koşu sırasında değişti; artifact korunur, üzerine yazılmaz"; exit 1; }
          git worktree add --detach "${RUNNER_TEMP}/k2-report-worktree" refs/remotes/origin/madsc/k2-discovery-report-store
          cd "${RUNNER_TEMP}/k2-report-worktree"
          mkdir -p madsc_kesif
          cp -a "${RUNNER_TEMP}/k2-new-report/." madsc_kesif/
          git add -- madsc_kesif/
          if git diff --cached --quiet; then
            echo "K2 raporlarında değişiklik yok"
            exit 0
          fi
          git commit -m "K2: persist discovery evidence"
          git push origin HEAD:refs/heads/madsc/k2-discovery-report-store
          echo "K2 raporları yalnızca ayrı arşiv dalına kaydedildi; main değişmedi."
      - name: Tekrar test baslatmadan sonucu bildir
        if: success()
        shell: bash
        run: |
          echo "Bu kesif calismasi yeni test turu tetiklemez; sonraki kesif zamanlanmis gunde iki kez (06:00 ve 18:00 UTC) calisir."
