name: MADSC TV - Birleşik Kanal Keşfi ve Testi
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: madsc-rapor-yazma
  cancel-in-progress: false
jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Depo dosyalarını al
        uses: actions/checkout@v4
      - name: 24. kural - ardışık hata güvenlik kontrolü
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/workflow_failure_gate.py
      - name: Kuyruk sonrası en güncel test geçmişini al
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Rapor başlangıç sürümünü kaydet
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse origin/main > "${RUNNER_TEMP}/madsc-rapor-base-sha"
      - name: Yayın kontrol aracını kur
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Python ortamını hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Görüntü işleme araçlarını kur
        run: python -m pip install Pillow cairosvg
      - name: Kalici arsivdeki URLleri tekrar testten koru
        run: python3 scripts/discovery_archive.py before
      - name: Kaynakları tara, tekrarları ayıkla ve adayları test et
        run: python3 madsc_akilli_kesif.py
      - name: Bulunan tum adaylari kalici arsive kaydet
        run: python3 scripts/discovery_archive.py after
      - name: Yedek arsiv kesif ve aday logo kanitlarini tek raporda denetle (EPG ertelendi)
        run: python3 scripts/four_stage_discovery_report.py
      - name: Test çıktılarını arşivle
        uses: actions/upload-artifact@v4
        with:
          name: candidate-logo-pngs
          path: madsc_kesif/candidate_pngs/
          if-no-files-found: ignore
      - name: Test raporlarını arşivle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madsc-kesif-raporu
          path: madsc_kesif/
          retention-days: 30
      - name: Raporları güvenli şekilde GitHub'a kaydet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -d madsc_kesif ]; then
            echo "Rapor dizini yok; kaydedilecek veri yok"
            exit 0
          fi
          cp -a madsc_kesif "${RUNNER_TEMP}/madsc-kesif-rapor"
          for attempt in $(seq 1 10); do
            git fetch origin main
            # Discovery modifies tracked report files; reset only the runner checkout.
            # A preserved report copy is restored below; remote playlists stay untouched.
            # Farkli bir calisma ayni rapor klasorunu degistirdiyse eski kopyayla ustune yazma.
            if ! git diff --quiet "$(cat "${RUNNER_TEMP}/madsc-rapor-base-sha")" origin/main -- madsc_kesif/; then
              echo "::warning::Rapor klasoru eszamanli degisti. GitHub uzerindeki yeni raporlar korundu; bu calismanin raporlari artifact icinde saklandi. Yeniden kanal testi baslatilmadi."
              exit 0
            fi
            git reset --hard origin/main
            git clean -fd -- madsc_kesif/
            git checkout -B report-save origin/main
            mkdir -p madsc_kesif
            cp -a "${RUNNER_TEMP}/madsc-kesif-rapor/." madsc_kesif/
            git add madsc_kesif/
            if git diff --cached --quiet; then
              echo "Raporlarda degisiklik yok"
              exit 0
            fi
            git commit -m "Update MADSC discovery reports"
            if git push origin HEAD:main; then
              echo "Raporlar kaydedildi"
              exit 0
            fi
            echo "Eszamanli guncelleme; yeniden deneme $attempt"
            sleep $((attempt * 2))
          done
          echo "Raporlar GitHub'a kaydedilemedi; artifact arsivinde korunuyor"
          exit 1
      - name: Tekrar test baslatmadan sonucu bildir
        if: success()
        shell: bash
        run: |
          echo "Bu kesif calismasi yeni test turu tetiklemez; sonraki kesif zamanlanmis gunde bir kez calisir."
