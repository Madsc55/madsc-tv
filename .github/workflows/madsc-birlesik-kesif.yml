name: MADSC TV Birlesik Kesif
on:
  push:
    paths:
      - 'madsc_akilli_kesif.py'
  workflow_dispatch:
  schedule:
    - cron: '15 5,17 * * *'
permissions:
  contents: write
concurrency:
  group: madsc-birlesik-kesif
  cancel-in-progress: false
jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: FFprobe kur
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Tek programda kesif, tekrar, kalite, logo ve aday testi
        run: python3 madsc_akilli_kesif.py
      - name: Rapor arsivi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madsc-kesif-raporu
          path: madsc_kesif/
          retention-days: 30
      - name: Yalniz raporlari kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add madsc_kesif/
          if ! git diff --cached --quiet; then
            git commit -m "Update MADSC discovery reports"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase -X ours origin/main; then
                if git push origin HEAD:main; then
                  exit 0
                fi
              else
                git rebase --abort || true
                echo "Report conflict: preserving report artifact; no force push"
                exit 1
              fi
              sleep 3
            done
            exit 1
          fi
