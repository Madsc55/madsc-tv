name: MADSC TV - Birleşik Kanal Keşfi ve Testi
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6,18 * * *'
permissions:
  contents: read
concurrency:
  group: madsc-rapor-yazma
  cancel-in-progress: false
jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Depo dosyalarını al
        uses: actions/checkout@v4
      - name: 24. kural - ardışık hata güvenlik kontrolü
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/workflow_failure_gate.py
      - name: Kuyruk sonrası dal bütünlüğünü doğrula
        run: |
          set -euo pipefail
          echo "Keşif, tetiklendiği commit üzerinde çalışır; main üzerine sıfırlama yapılmaz."
          git rev-parse HEAD
      - name: Yayın kontrol aracını kur
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Python ortamını hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Görüntü işleme araçlarını kur
        run: python -m pip install Pillow cairosvg
      - name: Kalici arsivdeki URLleri tekrar testten koru
        run: python3 scripts/discovery_archive.py before
      - name: Kaynakları tara, tekrarları ayıkla ve adayları test et
        run: python3 madsc_akilli_kesif.py
      - name: Bulunan tum adaylari kalici arsive kaydet
        run: python3 scripts/discovery_archive.py after
      - name: Aday yayın logo ve EPG kanıtlarını tek raporda birleştir
        if: ${{ false }} # EPG ertelendi; eski denetim sozlesmesi icin adim saklandi, CALISTIRILMAZ
        run: python3 scripts/candidate_epg_logo_join.py
      - name: Yedek arsiv kesif ve aday logo kanitlarini tek raporda denetle (EPG ertelendi)
        run: python3 scripts/four_stage_discovery_report.py
      - name: Test çıktılarını arşivle
        uses: actions/upload-artifact@v4
        with:
          name: candidate-logo-pngs
          path: madsc_kesif/candidate_pngs/
          if-no-files-found: ignore
      - name: Test raporlarını arşivle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madsc-kesif-raporu
          path: madsc_kesif/
          retention-days: 30
      - name: Keşif raporlarını yalnızca artifact olarak koru
        if: success()
        run: |
          echo "Keşif raporları madsc-kesif-raporu artifact içinde saklandı."
          echo "Korunan main dalına veya kanal listelerine otomatik commit/push yapılmaz."
      - name: Tekrar test baslatmadan sonucu bildir
        if: success()
        shell: bash
        run: |
          echo "Bu kesif calismasi yeni test turu tetiklemez; sonraki kesif zamanlanmis gunde iki kez (06:00 ve 18:00 UTC) calisir."
