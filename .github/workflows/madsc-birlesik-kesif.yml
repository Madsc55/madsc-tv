name: MADSC TV - Birleşik Kanal Keşfi ve Testi
on:
  push:
    paths:
      - 'madsc_akilli_kesif.py'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: madsc-rapor-yazma
  cancel-in-progress: false
jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Kuyruk sonrası en güncel test geçmişini al
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Yayın kontrol aracını kur
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow cairosvg
      - name: Kaynakları tara, tekrarları ayıkla ve adayları test et
        run: python3 madsc_akilli_kesif.py
      - name: Aday logolarını ayrı PNG incelemesine hazırla
        run: |
          python scripts/candidate_logo_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-logo-pngs
          path: madsc_kesif/candidate_pngs/
          if-no-files-found: ignore
      - name: Test raporlarını arşivle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madsc-kesif-raporu
          path: madsc_kesif/
          retention-days: 30
      - name: Raporları güvenli şekilde GitHub'a kaydet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -d madsc_kesif ]; then
            echo "Rapor dizini yok; kaydedilecek veri yok"
            exit 0
          fi
          cp -a madsc_kesif "${RUNNER_TEMP}/madsc-kesif-rapor"
          for attempt in $(seq 1 10); do
            git fetch origin main
            # Discovery modifies tracked report files; reset only the runner checkout.
            # A preserved report copy is restored below; remote playlists stay untouched.
            git reset --hard origin/main
            git clean -fd -- madsc_kesif/
            git checkout -B report-save origin/main
            mkdir -p madsc_kesif
            cp -a "${RUNNER_TEMP}/madsc-kesif-rapor/." madsc_kesif/
            git add madsc_kesif/
            if git diff --cached --quiet; then
              echo "Raporlarda degisiklik yok"
              exit 0
            fi
            git commit -m "Update MADSC discovery reports"
            if git push origin HEAD:main; then
              echo "Raporlar kaydedildi"
              exit 0
            fi
            echo "Eszamanli guncelleme; yeniden deneme $attempt"
            sleep $((attempt * 2))
          done
          echo "Raporlar GitHub'a kaydedilemedi; artifact arsivinde korunuyor"
          exit 1
      - name: Yeni aday varsa sonraki test turunu hemen baslat
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remaining=$(python3 -c 'import json; print(json.load(open("madsc_kesif/ozet.json")).get("yeni_bekleyen_sonraki",0))')
          echo "Henuz test edilmemis aday: $remaining"
          if [ "$remaining" -gt 0 ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/madsc-birlesik-kesif.yml/dispatches" -f ref=main
            echo "Siradaki test turu tetiklendi."
          else
            echo "Yeni aday kalmadi; gereksiz test turu baslatilmadi."
          fi
