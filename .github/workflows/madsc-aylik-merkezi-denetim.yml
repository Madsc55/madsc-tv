name: MADSC - Beş Aşamalı Toplu Sistem Denetimi
run-name: "MADSC | Beş aşamalı toplu kontrol | ${{ github.event_name == 'schedule' && 'Zamanlanmış denetim' || 'Değişiklik sonrası denetim' }}"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'OZELLIK_ENVANTERI.md'
      - 'DEVAM_NOTU.md'
      - 'TOPLU_DURUM_RAPORU.md'
      - 'GUVENLIK_KURALLARI.md'
      - '.github/workflows/madsc-documentation-check.yml'
      - 'CALISANLAR.m3u'
      - 'scripts/central_workflow_inventory.py'
      - 'test_central_workflow_inventory.py'
      - 'scripts/central_run_status.py'
      - 'scripts/central_main_playlist_run_evidence.py'
      - 'test_central_main_playlist_run_evidence.py'
      - 'scripts/central_failure_stage_report.py'
      - 'scripts/central_backup_evidence.py'
      - 'scripts/central_isolated_git_restore.py'
      - 'test_central_isolated_git_restore.py'
      - 'scripts/build_epg.py'
      - 'scripts/build_ibo_epg_test.py'
      - '.github/workflows/epg-gunluk.yml'
      - '.github/workflows/epg-pages.yml'
      - 'scripts/central_identity_epg_logo_audit.py'
      - 'madsc_akilli_kesif.py'
      - 'scripts/discovery_archive.py'
      - 'scripts/automatic_png_logos.py'
      - '.github/workflows/automatic-png-logos.yml'
      - 'scripts/candidate_logo_report.py'
      - '.github/workflows/madsc-birlesik-kesif.yml'
      - 'scripts/candidate_logo_missing_report.py'
      - 'test_candidate_logo_missing_report.py'
      - 'scripts/central_ibo_review_queue.py'
      - 'test_central_ibo_review_queue.py'
      - 'scripts/central_management_summary.py'
      - 'scripts/central_short_status.py'
      - 'scripts/central_open_gaps.py'
      - 'scripts/central_all_remaining_tasks.py'
      - 'test_central_all_remaining_tasks.py'
      - 'test_central_open_gaps.py'
      - 'test_central_short_status.py'
      - 'test_central_management_summary.py'
      - 'test_central_identity_epg_logo_audit.py'
      - 'test_central_backup_evidence.py'
      - 'test_central_failure_stage_report.py'
      - 'scripts/central_six_area_audit.py'
      - 'scripts/central_eight_task_audit.py'
      - 'scripts/central_eighteen_task_audit.py'
      - 'test_central_eighteen_task_audit.py'
      - 'scripts/central_source_reconciliation.py'
      - 'scripts/central_duplicate_test_audit.py'
      - 'scripts/central_consolidation_audit.py'
      - 'scripts/central_protected_write_gate.py'
      - 'test_central_protected_write_gate.py'
      - '.github/workflows/test-31-protected-write-gate.yml'
      - 'test_central_consolidation_audit.py'
      - 'test_tek_merkez_tetikleme.py'
      - 'test_central_duplicate_test_audit.py'
      - 'test_central_source_reconciliation.py'
      - 'test_central_eight_task_audit.py'
      - 'test_central_run_status.py'
      - '.github/workflows/madsc-aylik-merkezi-denetim.yml'
  schedule:
    - cron: '0 7 1,15 * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: madsc-aylik-merkezi-denetim
  cancel-in-progress: false
jobs:
  tum-sistem:
    name: GitHub dosya kural rapor ve otomasyon envanteri
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu salt okunur al
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tum takip edilen dosyalari ve koruma kurallarini say
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p madsc_merkezi_denetim
          git ls-files > madsc_merkezi_denetim/takip_edilen_dosyalar.txt
          git ls-files '.github/workflows/*' > madsc_merkezi_denetim/is_akislari.txt
          for file in AGENTS.md DEVAM_NOTU.md TOPLU_DURUM_RAPORU.md OZELLIK_ENVANTERI.md GUVENLIK_KURALLARI.md SEKIZ_GOREV_TOPLU_DENETIM.md CALISANLAR.m3u; do
            test -f "$file" || { echo "::error::Zorunlu dosya eksik: $file"; exit 1; }
          done
          sha256sum AGENTS.md DEVAM_NOTU.md TOPLU_DURUM_RAPORU.md OZELLIK_ENVANTERI.md GUVENLIK_KURALLARI.md SEKIZ_GOREV_TOPLU_DENETIM.md CALISANLAR.m3u > madsc_merkezi_denetim/korunan_dosyalar_sha256.txt
      - name: Proje kayitlari ve dokumantasyonu merkezi kontrolde dogrula
        shell: bash
        run: |
          set -euo pipefail
          test -s AGENTS.md
          test -s OZELLIK_ENVANTERI.md
          test -s DEVAM_NOTU.md
          test -s TOPLU_DURUM_RAPORU.md
          grep -q 'Kural 25' AGENTS.md
          grep -q 'build_epg.py' OZELLIK_ENVANTERI.md
          head -n 1 CALISANLAR.m3u | grep -q '#EXTM3U'
      - name: Kritik merkezi rapor dosyalarinin sozdizimini onceden dogrula
        run: |
          python3 -m py_compile scripts/central_consolidation_audit.py scripts/central_protected_write_gate.py scripts/candidate_logo_report.py scripts/candidate_logo_missing_report.py
      - name: Korunan liste yazma kapisini merkezi kosuda denetle
        run: |
          python3 -m pip install pyyaml
          python3 scripts/central_protected_write_gate.py
      - name: Tum otomasyonlarin zamanlama ve izin haritasini olustur
        run: python3 scripts/central_workflow_inventory.py
      - name: Yeni aday logo eksiklerini merkezi raporla
        run: python3 -m scripts.candidate_logo_missing_report
      - name: Logo EPG kimlik ve test gecmisini birlestir
        run: python3 scripts/central_identity_epg_logo_audit.py
      - name: IBO adaylarini onaysiz inceleme kuyruguna hazirla
        run: python3 scripts/central_ibo_review_queue.py
      - name: Korunan Git dosyalarini gecici dizinde geri yukleyip dogrula
        run: python3 scripts/central_isolated_git_restore.py
      - name: Korunan dosya ve yedek kanitlarini denetle
        run: python3 scripts/central_backup_evidence.py
      - name: Gecmis test tekrarlarini tek raporda olc
        run: python3 scripts/central_duplicate_test_audit.py
      - name: Kaynak ve hedef farkini gercek tanimlardan denetle
        run: python3 scripts/central_source_reconciliation.py
      - name: Sekiz gorevi tek raporda denetle
        run: python3 scripts/central_eight_task_audit.py
      - name: On sekiz gelistirmeyi bes asamada topluca denetle
        run: python3 scripts/central_eighteen_task_audit.py
      - name: Alti plan basligini tek raporda denetle
        run: python3 scripts/central_six_area_audit.py
      - name: Merkezi otomasyon risk raporunu test et
        run: python3 -m unittest test_central_workflow_inventory -v
      - name: Tum Python dosyalarinin sozdizimini kontrol et
        run: |
          python3 - <<'PY'
          import ast
          import subprocess
          from pathlib import Path
          files = subprocess.check_output(['git', 'ls-files', '*.py'], text=True).splitlines()
          for name in files:
              ast.parse(Path(name).read_text(encoding='utf-8-sig'), filename=name)
          print(f'{len(files)} Python dosyasinin sozdizimi dogrulandi.')
          PY
      - name: Mevcut sistem saglik testlerini calistir
        run: |
          set -o pipefail
          python3 -m unittest discover -s . -p 'test_*.py' -v 2>&1 | tee madsc_merkezi_denetim/birim_test_sonuclari.log
          python3 tools/sistem_saglik_denetimi.py
      - name: Actions son durumunu raporla
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq '{checked_runs: (.workflow_runs|length), failed: [.workflow_runs[]|select(.conclusion=="failure" or .conclusion=="timed_out")|{id,name,conclusion}], active: [.workflow_runs[]|select(.status=="in_progress" or .status=="queued")|{id,name,status}]}' > madsc_merkezi_denetim/actions_durum.json
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" --jq '.workflows[] | {id,name,path,state}' > madsc_merkezi_denetim/github_workflow_durumlari.jsonl
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq '[.workflow_runs[] | {workflow_id,name,status,conclusion,run_id:.id,created_at,html_url}]' > madsc_merkezi_denetim/son_100_kosu.json
          python3 scripts/central_run_status.py
          python3 scripts/central_main_playlist_run_evidence.py
          python3 scripts/central_consolidation_audit.py
          # Her push sonrasi, yeni kosu beklemeden, son tamamlanmis run'lari
          # GitHub API uzerinden oku; yeni test veya workflow tetikleme.
          python3 - <<'PY'
          import json
          from pathlib import Path
          folder = Path("madsc_merkezi_denetim")
          runs = json.loads((folder / "son_100_kosu.json").read_text(encoding="utf-8"))
          import os
          current_run_id = int(os.environ["GITHUB_RUN_ID"])
          current_run = [r for r in runs if r.get("run_id") == current_run_id]
          # Calismakta olan denetim kendi basarisini ilan edemez.
          latest = {}
          for run in sorted(runs, key=lambda r: r.get("created_at") or "", reverse=True):
              if run.get("run_id") == current_run_id:
                  continue
              key = run.get("workflow_id")
              if key is not None and key not in latest:
                  latest[key] = run
          checked = []
          for run in latest.values():
              checked.append({
                  "workflow_id": run.get("workflow_id"),
                  "name": run.get("name"),
                  "run_id": run.get("run_id"),
                  "url": run.get("html_url"),
                  "status": run.get("status"),
                  "conclusion": run.get("conclusion"),
                  "verified_success": run.get("status") == "completed" and run.get("conclusion") == "success",
              })
          summary = {
              "checked": len(checked),
              "current_run": {"id": current_run_id, "status": "IN_PROGRESS_NOT_VERIFIED"},
              "current_run_found_in_sample": bool(current_run),
              "successful": sum(x["verified_success"] for x in checked),
              "failed": [x for x in checked if x["status"] == "completed" and x["conclusion"] in ("failure", "timed_out", "startup_failure", "action_required")],
              "pending": [x for x in checked if x["status"] != "completed"],
              "unknown": "Only latest runs among the last 100 are covered; missing history is not success.",
              "workflows": checked,
          }
          (folder / "actions_otomatik_sonuc_dogrulama.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(f"\n### Otomatik Actions doğrulaması\n- Kontrol: {summary['checked']} workflow; basarili: {summary['successful']}; basarisiz: {len(summary['failed'])}; devam: {len(summary['pending'])}\n")
          PY
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          folder = Path('madsc_merkezi_denetim')
          runs = json.loads((folder / 'son_100_kosu.json').read_text())
          failed = [r for r in runs if r.get('conclusion') in ('failure', 'timed_out', 'startup_failure', 'action_required')]
          evidence = []
          for run in failed[:20]:
              rid = run.get('run_id')
              cmd = ['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{rid}/jobs?per_page=100']
              result = subprocess.run(cmd, capture_output=True, text=True, timeout=25)
              if result.returncode:
                  evidence.append({'run_id': rid, 'status': 'API_HATASI', 'jobs': []})
                  continue
              try:
                  data = json.loads(result.stdout)
                  jobs = [{'name': j.get('name'), 'conclusion': j.get('conclusion'),
                           'steps': [{'name': st.get('name'), 'conclusion': st.get('conclusion')} for st in j.get('steps', [])]}
                          for j in data.get('jobs', [])]
                  evidence.append({'run_id': rid, 'status': 'ALINDI', 'jobs': jobs})
              except (ValueError, TypeError):
                  evidence.append({'run_id': rid, 'status': 'YANIT_HATASI', 'jobs': []})
          (folder / 'basarisiz_kosu_isleri.json').write_text(json.dumps(evidence, ensure_ascii=False, indent=2))
          PY
          python3 scripts/central_failure_stage_report.py
          python3 scripts/central_all_remaining_tasks.py
          python3 scripts/central_management_summary.py
          python3 scripts/central_open_gaps.py
          python3 scripts/central_short_status.py
          cat madsc_merkezi_denetim/madsc_kisa_durum_ozeti.md >> "$GITHUB_STEP_SUMMARY"
          cat madsc_merkezi_denetim/toplu_tetikleme_ve_kabul_ozeti.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## MADSC - Ayda iki kez merkezi denetim" >> "$GITHUB_STEP_SUMMARY"
          echo "- Takip edilen dosya: $(wc -l < madsc_merkezi_denetim/takip_edilen_dosyalar.txt)" >> "$GITHUB_STEP_SUMMARY"
          echo "- İş akışı sayısı: $(wc -l < madsc_merkezi_denetim/is_akislari.txt)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Korunan listelerde otomatik degisiklik yapilmadi." >> "$GITHUB_STEP_SUMMARY"
          echo "- Bu denetim mevcut tarama/testleri otomatik tetiklemez; kapsam eksikleri sonraki asamada tamamlanacak." >> "$GITHUB_STEP_SUMMARY"
      - name: Tum denetim raporlarini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madsc-aylik-merkezi-denetim
          path: |
            madsc_merkezi_denetim/
            madsc_bakim/
          if-no-files-found: warn
          retention-days: 30
