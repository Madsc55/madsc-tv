name: IPTV PNG logolarini yayimla
on:
  workflow_dispatch:
  push:
    paths:
      - 'logos/duzeltilmis-*.svg'
concurrency:
  group: madsc-protected-publish-main
  cancel-in-progress: false
jobs:
  publish:
    name: PNG logo uretimi ve korunan yazma kontrolu
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: SVG logolarini PNG bicimine donustur
        run: |
          python -m pip install cairosvg
          python - <<'PY'
          import glob, cairosvg
          for p in glob.glob('logos/duzeltilmis-*.svg'):
              cairosvg.svg2png(url=p,write_to=p[:-4]+'.png',output_width=320,output_height=320)
          PY
      - name: PNG logolarini kontrollu kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos/duzeltilmis-*.png
          git diff --cached --quiet || (git commit -m "Publish IBO-compatible PNG logos" && git pull --rebase origin main && python3 tools/protected_write_gate.py --base origin/main && git push)
