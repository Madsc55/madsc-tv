name: Publish IPTV PNG logos
on:
  workflow_dispatch:
  push:
    paths:
      - 'logos/duzeltilmis-*.svg'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Convert SVG logos to PNG
        run: |
          python -m pip install cairosvg
          python - <<'PY'
          import glob, cairosvg
          for p in glob.glob('logos/duzeltilmis-*.svg'):
              cairosvg.svg2png(url=p,write_to=p[:-4]+'.png',output_width=320,output_height=320)
          PY
      - name: Commit PNG logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos/duzeltilmis-*.png
          git diff --cached --quiet || (git commit -m "Publish IBO-compatible PNG logos" && git pull --rebase origin main && git push)
