name: Birlesik Aday Onay Raporu
on:
  workflow_dispatch:
  schedule:
    - cron: '45 6,18 * * *'
  push:
    paths:
      - 'scripts/birlesik_aday_raporu.py'
      - '.github/workflows/birlesik-aday-raporu.yml'
permissions:
  contents: read
jobs:
  rapor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore longitudinal observations
        uses: actions/cache/restore@v4
        with:
          path: KARARLILIK_GECMISI.json
          key: birlesik-rapor-${{ github.run_id }}
          restore-keys: |
            kanal-kararlilik-
      - name: Install ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Candidate discovery
        run: python3 -u yeni_kanal_tara.py
        env:
          SCAN_BATCH: '-1'
      - name: Technical stream evidence
        run: python3 -u scripts/oncelikli_kanal_dogrula.py
      - name: Probe general candidates with real video and audio checks
        run: python3 -u scripts/genel_aday_medya_test.py
        env:
          ADAY_TEST_GRUBU: "0"
      - name: Candidate scoring with real evidence
        run: python3 scripts/akilli_aday_puanla.py YENILER_TARAMA_RAPORU.csv ONCELIKLI_KANAL_TEK_NIK_RAPOR.csv GENEL_ADAY_GERCEK_MEDYA_RAPORU.csv
      - name: Stability evidence
        run: python3 scripts/kanal_kararlilik_takip.py
      - name: Consolidated approval report
        run: python3 scripts/birlesik_aday_raporu.py
      - name: Upload separate review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BIRLESIK-ADAY-ONAY-RAPORU
          retention-days: 30
          if-no-files-found: error
          path: |
            BIRLESIK_ADAY_ONAY_RAPORU.csv
            BIRLESIK_ADAY_OZET.json
            GENEL_ADAY_GERCEK_MEDYA_RAPORU.csv
            GENEL_ADAY_MEDYA_OZET.json
