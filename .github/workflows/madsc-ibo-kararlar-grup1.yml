name: MADSC - Historical Group 1 Decision Review
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: madsc-ibo-group1-review
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify saved decision source without replay
        run: |
          set -euo pipefail
          test -f scripts/apply_ibo_decisions_group1.py
          test -f CALISANLAR.m3u
          git diff --exit-code -- CALISANLAR.m3u
