name: "MADSC - Birlesik Salt Okunur Durum Raporu"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/birlesik-durum-raporu.yml"
      - "tools/eksik_turk_kanal_takibi.py"
      - "tools/guncel_test_durum_ozeti.py"
  workflow_dispatch:
  schedule:
    - cron: "40 6,18 * * *"
    - cron: "10 5 * * 1"
    - cron: "10 5 1 * *"
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate combined status without starting any stream tests
        run: python tools/guncel_test_durum_ozeti.py > combined-status.json
      - name: Report missing Turkish channel targets without retesting
        run: python tools/eksik_turk_kanal_takibi.py > missing-turkish-channels.json
      - name: Audit 155-source inventory without fetching streams
        run: python tools/kaynak_kapsam_denetimi.py > source-inventory-audit.json
      - name: Archive read-only snapshot
        uses: actions/upload-artifact@v4
        with:
          name: madsc-combined-status
          path: |
            combined-status.json
            missing-turkish-channels.json
            source-inventory-audit.json
          retention-days: 30
