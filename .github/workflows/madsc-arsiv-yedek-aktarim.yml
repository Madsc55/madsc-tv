name: MADSC - Arsivden Yedeklere Tek Seferlik Aktarim
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: madsc-arsiv-yedek-aktarim
  cancel-in-progress: false
jobs:
  aktar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Safe dry-run notice
        run: echo 'Protected playlist mutation requires explicit approval; automatic mutation disabled.'


