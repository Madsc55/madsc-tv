name: MADSC - Arsivden Yedeklere Tek Seferlik Aktarim
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/madsc-arsiv-yedek-aktarim.yml'
permissions:
  contents: write
concurrency:
  group: madsc-arsiv-yedek-aktarim
  cancel-in-progress: false
jobs:
  aktar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Arşiv kayıtlarını YEDEKLER'e tekrarsız ekle
        run: python3 scripts/stage_archive_to_backups.py
      - name: Dosya bütünlüğünü doğrula
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('CALISANLAR.m3u').read_text()
          assert s.startswith('#EXTM3U')
          assert s.count('#EXTINF:') == sum(1 for x in s.splitlines() if x.startswith('#EXTINF:'))
          print('M3U structure checked')
          PY
      - name: Ana listeyi kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CALISANLAR.m3u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Stage archived candidates in YEDEKLER for user IBO review"
          git push origin HEAD:main
