name: MADSC 05 - Genel Bakim Toplu
on:
  workflow_dispatch:
  push:
    branches:
      - madsc/bes-sistem-toplu-birlestirme
    paths:
      - '.github/workflows/madsc-05-genel-bakim.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: madsc-genel-bakim-tek-kosu
  cancel-in-progress: false
jobs:
  kademe-1-guvenlik:
    name: 1 - Guvenlik tek toplu kosu
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[madsc-full-batch]')
    uses: ./.github/workflows/madsc-01-guvenlik.yml
    permissions:
      contents: read
      actions: read
  kademe-2-kesif:
    name: 2 - Kesif tek toplu kosu
    needs: kademe-1-guvenlik
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[madsc-full-batch]')) }}
    uses: ./.github/workflows/madsc-02-kesif.yml
    permissions:
      contents: read
      actions: read
  kademe-3-kanal-test:
    name: 3 - Kanal testleri tek toplu kosu
    needs: kademe-2-kesif
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[madsc-full-batch]')) }}
    uses: ./.github/workflows/madsc-03-kanal-test.yml
    permissions:
      contents: read
      actions: read
  kademe-4-arsiv-yedek:
    name: 4 - Arsiv ve yedek tek toplu kosu
    needs: kademe-3-kanal-test
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[madsc-full-batch]')) }}
    uses: ./.github/workflows/madsc-04-arsiv-yedek.yml
    permissions:
      contents: read
      actions: read
  genel-bakim:
    needs: [kademe-1-guvenlik, kademe-2-kesif, kademe-3-kanal-test, kademe-4-arsiv-yedek]
    if: ${{ always() }}
    name: MADSC 05 - Genel Bakim Toplu - tek kosuda butun denetimler
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Korunan dosyalarin baslangic ozeti
        run: |
          mkdir -p madsc_merkezi_denetim
          sha256sum CALISANLAR.m3u AGENTS.md GUVENLIK_KURALLARI.md > "${RUNNER_TEMP}/madsc-protected.sha256"
      - name: Kategoriye ait tum rapor kontrolleri
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/five_category_preflight.py
          python3 scripts/five_category_92_workflow_audit.py
          python3 scripts/central_workflow_inventory.py
          python3 scripts/central_source_reconciliation.py
          python3 scripts/central_duplicate_test_audit.py
          python3 scripts/central_backup_evidence.py
          python3 scripts/central_identity_epg_logo_audit.py
          python3 scripts/central_ibo_review_queue.py
          python3 scripts/central_eight_task_audit.py
          python3 scripts/central_management_summary.py
          python3 scripts/central_eighteen_task_audit.py
          python3 scripts/central_all_remaining_tasks.py
          python3 scripts/central_open_gaps.py
          python3 scripts/central_single_screen_report.py
      - name: 92 satirlik toplu esdegerlik matrisi kabul kapisi
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path
          path = Path("madsc_merkezi_denetim/92_workflow_esdegerlik_kabul_matrisi.csv")
          with path.open(encoding="utf-8", newline="") as stream:
              rows = list(csv.DictReader(stream))
          assert len(rows) == 92, f"Expected 92 legacy rows, got {len(rows)}"
          assert len({r["legacy_workflow"] for r in rows}) == 92, "Duplicate workflow in review matrix"
          assert all(r["migration_decision"] == "BLOCKED_NEEDS_BEHAVIOR_EVIDENCE" for r in rows), "Unsafe migration approval"
          print("92 legacy workflows documented; migration remains blocked pending parity evidence")
          PY
      - name: Toplu gecis kuyruklari ve koruma kabul kapisi
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          folder = Path("madsc_merkezi_denetim")
          queues = json.loads((folder / "bes_kategori_toplu_eksik_is_kuyrugu.json").read_text(encoding="utf-8"))
          priorities = json.loads((folder / "92_workflow_oncelikli_gecis_isleri.json").read_text(encoding="utf-8"))
          audit = json.loads((folder / "92_workflow_gorev_ve_kategori_haritasi.json").read_text(encoding="utf-8"))
          assert len(queues) == 5, "Expected five category queues"
          assert sum(category["count"] for category in queues.values()) == 92, "Category queue lost a legacy workflow"
          assert priorities["total"] == 92 and len(priorities["ordered_workflows"]) == 92
          assert audit["migration_blocked_count"] == 92, "Unsafe legacy retirement"
          assert "legacy_workflows_with_missing_script_file" in audit, "Missing legacy script check not run"
          assert audit["legacy_workflows_with_missing_script_file"] >= 0
          assert audit["behavioral_parity_verified_count"] == 0, "Unverified parity must never be marked complete"
          assert len(audit["items"]) == 92, "Missing detailed legacy evidence"
          assert all(not item["behavioral_parity_verified"] for item in audit["items"]), "Unproven parity accepted"
          assert all("missing_legacy_script_files" in item for item in audit["items"]), "Missing script file evidence absent"
          assert all(item["migration_gap_reasons"] for item in audit["items"]), "A legacy workflow has no review reason"
          assert sum(audit["integration_evidence_counts"].values()) == 92, "Evidence classification lost workflows"
          assert len({x["file"] for x in priorities["ordered_workflows"]}) == 92
          assert all(x["gaps"] for x in priorities["ordered_workflows"]), "Missing migration gap evidence"
          assert all(x["priority"] in ("HIGH", "NORMAL") for x in priorities["ordered_workflows"])
          assert all(category["count"] == len(category["workflows"]) for category in queues.values())
          print("Five categories and all 92 outstanding workflows accounted for; no legacy workflow retired.")
          PY
      - name: Kesif zamanlamasi ve salt okunur yetki kabul kontrolu
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path(".github/workflows/madsc-02-kesif.yml").read_text()
          assert "cron: '17 5,17 * * *'" in text, "Twice-daily discovery schedule missing"
          assert "contents: read" in text, "Read-only permission missing"
          assert "contents: write" not in text, "Discovery must not gain write permission"
          assert "workflow_call:" in text and "workflow_dispatch:" in text
          print("Discovery shadow schedule configured; activation requires default branch.")
          PY
      - name: Kategoriye ait tum regresyon testleri
        run: python3 -m unittest test_central_workflow_inventory test_central_eighteen_task_audit test_central_all_remaining_tasks test_central_open_gaps test_central_single_screen_report -v
      - name: Tek merkez push regresyon testleri
        run: python3 -m unittest test_central_consolidation_audit test_tek_merkez_tetikleme -v
      - name: Esdegerlik kapisi regresyon testleri
        run: python3 -m unittest test_five_system_migration_audit test_five_category_92_workflow_audit -v
      - name: Dort onceki kategori de basarili olmali
        if: always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[madsc-full-batch]'))
        env:
          SECURITY_RESULT: ${{ needs.kademe-1-guvenlik.result }}
          DISCOVERY_RESULT: ${{ needs.kademe-2-kesif.result }}
          CHANNEL_RESULT: ${{ needs.kademe-3-kanal-test.result }}
          ARCHIVE_RESULT: ${{ needs.kademe-4-arsiv-yedek.result }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SECURITY DISCOVERY CHANNEL ARCHIVE; do
            key="${name}_RESULT"
            value="${!key}"
            echo "${name}: ${value}"
            if [[ "${value}" != "success" ]]; then
              echo "::error::${name} category did not pass: ${value}"
              exit 1
            fi
          done
      - name: Korunan dosyalar degismedi
        if: always()
        run: sha256sum -c "${RUNNER_TEMP}/madsc-protected.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: madsc-genel-bakim-tek-kosu-rapor
          path: madsc_merkezi_denetim/
          if-no-files-found: warn
# Tek workflow_dispatch tum kategori denetimlerini calistirir; mevcut canli eski is akislari korunur.
