name: MADSC 05 - Genel Bakim Toplu
on:
  workflow_dispatch:
  push:
    branches:
      - madsc/bes-sistem-toplu-birlestirme
    paths:
      - '.github/workflows/madsc-05-genel-bakim.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: madsc-genel-bakim-tek-kosu
  cancel-in-progress: false
jobs:
  kademe-1-guvenlik:
    name: 1 - Guvenlik tek toplu kosu
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[madsc-full-batch]')
    uses: ./.github/workflows/madsc-01-guvenlik.yml
    permissions:
      contents: read
      actions: read
  kademe-2-kesif:
    name: 2 - Kesif tek toplu kosu
    needs: kademe-1-guvenlik
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[madsc-full-batch]')) }}
    uses: ./.github/workflows/madsc-02-kesif.yml
    permissions:
      contents: read
      actions: read
  kademe-3-kanal-test:
    name: 3 - Kanal testleri tek toplu kosu
    needs: kademe-2-kesif
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[madsc-full-batch]')) }}
    uses: ./.github/workflows/madsc-03-kanal-test.yml
    permissions:
      contents: read
      actions: read
  kademe-4-arsiv-yedek:
    name: 4 - Arsiv ve yedek tek toplu kosu
    needs: kademe-3-kanal-test
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[madsc-full-batch]')) }}
    uses: ./.github/workflows/madsc-04-arsiv-yedek.yml
    permissions:
      contents: read
      actions: read
  genel-bakim:
    needs: kademe-4-arsiv-yedek
    if: ${{ always() }}
    name: MADSC 05 - Genel Bakim Toplu - tek kosuda butun denetimler
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Korunan dosyalarin baslangic ozeti
        run: |
          mkdir -p madsc_merkezi_denetim
          sha256sum CALISANLAR.m3u AGENTS.md GUVENLIK_KURALLARI.md > "${RUNNER_TEMP}/madsc-protected.sha256"
      - name: Kategoriye ait tum rapor kontrolleri
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/five_category_preflight.py
          python3 scripts/five_category_92_workflow_audit.py
          python3 scripts/central_workflow_inventory.py
          python3 scripts/central_source_reconciliation.py
          python3 scripts/central_duplicate_test_audit.py
          python3 scripts/central_backup_evidence.py
          python3 scripts/central_identity_epg_logo_audit.py
          python3 scripts/central_ibo_review_queue.py
          python3 scripts/central_eight_task_audit.py
          python3 scripts/central_management_summary.py
          python3 scripts/central_eighteen_task_audit.py
          python3 scripts/central_all_remaining_tasks.py
          python3 scripts/central_open_gaps.py
          python3 scripts/central_single_screen_report.py
      - name: Kategoriye ait tum regresyon testleri
        run: python3 -m unittest test_central_workflow_inventory test_central_eighteen_task_audit test_central_all_remaining_tasks test_central_open_gaps test_central_single_screen_report -v
      - name: Esdegerlik kapisi regresyon testleri
        run: python3 -m unittest test_five_system_migration_audit test_five_category_92_workflow_audit -v
      - name: Korunan dosyalar degismedi
        if: always()
        run: sha256sum -c "${RUNNER_TEMP}/madsc-protected.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: madsc-genel-bakim-tek-kosu-rapor
          path: madsc_merkezi_denetim/
          if-no-files-found: warn
# Tek workflow_dispatch tum kategori denetimlerini calistirir; mevcut canli eski is akislari korunur.
