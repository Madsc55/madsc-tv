name: Test missing channels and save to backups
on:
  push:
    branches: [main]
    paths:
      - 'tarama/iptv-org-tr-adaylar-2026-10-10.m3u'
      - 'scripts/test_kanal_adaylari.py'
      - '.github/workflows/test-kanal-adaylari.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test stream responses and build backup
        run: python3 scripts/test_kanal_adaylari.py
      - name: Upload candidate test outputs for manual approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ADAY-TEST-RAPORU-ONAY-BEKLIYOR
          path: |
            yedekler/TARAMA-TEST-SONUCLARI.m3u
            tarama/son-test-raporu.json
          if-no-files-found: warn
